function heaviest(list, excludeId){
  let best = null, n = -1;
  list.forEach(r=>{ if(r.archived || r.id===excludeId) return; const l = utf8len(r.name); if(l>n){ n = l; best = r.name; } });
  return best;
}
/* role is whose name this is: 'boss', 'worker' or 'job'. The other two slots
   take the real names already on this phone (your name, and the heaviest job
   or worker name), and a stand-in only where there is none yet. excludeId is
   the record being edited, so a name is never weighed against itself.
   `given` lets a caller supply the other two outright. */
async function nameCheck(raw, role, excludeId, given){
  role = role || 'boss';
  const name = String(raw==null?'':raw).trim();
  if(!name) return { level:'empty', name:name };
  const v = bossValid(null, name);
  if(!v.ok) return { level:'bad', name:name, msg:nameProblem(v) };
  const alt = nameStandIns(name), spare = [alt.job, alt.worker];
  const known = given || {
    boss: hasIdentity(settings) ? settings.boss.name : null,
    job: heaviest(jobs, excludeId),
    worker: heaviest(roster, excludeId)
  };
  let guessed = false, n = {};
  ['boss','job','worker'].forEach(slot=>{
    if(slot===role) n[slot] = name;
    else if(known[slot]) n[slot] = known[slot];
    else { n[slot] = spare.shift(); guessed = true; }
  });
  let full = await EGSCrew.measure(probeList(n, PROBE_TASK));
  if(!full.ok){ n = { boss:name, job:name, worker:name }; guessed = true; full = await EGSCrew.measure(probeList(n, PROBE_TASK)); }
  if(full.ok && full.fits) return { level:'ok', name:name };
  const beside = guessed ? 'If the other names on a list run about as long' : 'Beside the longest names you already have';
  const bare = await EGSCrew.measure(probeList(n, 'A'));
  if(bare.ok && bare.fits) return { level:'tight', name:name,
    msg:'A name this long takes up a lot of a link. '+beside+', a full-length task won\u2019t fit in one text, and I\u2019ll have to ask you to shorten it when you send. A shorter name avoids that.' };
  return { level:'none', name:name,
    msg:'A name this long leaves no room in a link. '+beside+', not even a short task would fit, so I couldn\u2019t send a list at all. A shorter name fixes that.' };
}

/* ============================================================
   EGS-STD:schema — the stored shape carries a number, and it is READ.
   ============================================================
   Two version systems, named apart everywhere they appear:

     * PRO_SCHEMA_VERSION — the shape of what is IN localStorage on THIS
       phone. Written into settings by an ordinary save, read here at load
       and again at every restore, climbed by the ladder below.
     * BACKUP_VERSION — the shape of an EXPORTED .json. It describes the
       file, never the phone.

   They are never compared and never assigned across. */
const PRO_SCHEMA_VERSION = 4;

/* The ladder — the registration point. The key is the version being migrated
   TO, and the function takes the stored shape from key-1 up to key, in
   memory, in place. A rung must be safe to run twice. Every future change to
   what this app writes into localStorage MUST add a rung here.

   A rung runs in memory because nothing about startup may write. So a rung
   that changed a store names it in proSchemaDirty, and the same ordinary
   save that stamps the number writes that store down straight after it.
   `settings` is never named: saveSettings IS the save doing the flushing.

   The number only governs what is written in the same call as the number:
   here, the settings it sits in. The roster and the jobs are other keys,
   so the order between them and the number is a choice, and it is made for
   the older build, not this one. The number goes down FIRST. An older build
   that opens the phone after that sees a newer number and stops at its gate
   before it reads anything; one that opened it before sees only the old
   shape. Data in the new shape under the old number is the one state that
   must never exist, because an older build reads that without a gate (the
   stage 3 build drops a crew it cannot read for its __bak copy, quietly,
   and its next save writes that stale copy back). This build, for its part,
   never trusts the number about another key: it reads the roster and the
   jobs in either shape (liftRecordsCopy).

   Version 1 was settings alone: {schemaVersion, boss:{id, name}}.
   Version 2 adds the roster and the jobs, each an array of records.
   Version 3 adds lists, in IndexedDB: one record per job's day.
   Version 4 holds 64-bit permanent IDs (11 characters) where versions 1 to 3
   held 128-bit ones (22). 64 bits is the permanent length. */
const PRO_MIGRATIONS = {
  /* 1 -> 2: nothing to convert. Version 1 never wrote the roster or the jobs,
     and an absent store reads as empty, so the data is already in shape.
     The rung is here so the number tells the two builds apart: a version 1
     build that somehow opens version 2 data shows its newer-version gate
     instead of carrying on. */
  2: function(){},
  /* 2 -> 3: nothing to convert either. Version 2 never wrote a list, and an
     empty store reads as no lists. The number moves so a version 2 build
     shows its gate rather than exporting a backup it believes has no lists
     in it. */
  3: function(){},
  /* 3 -> 4: the first rung that changes data. Every permanent ID on this
     phone goes from 128 bits to 64: the boss's, each worker's, each job's,
     and (in IndexedDB, by its own ladder) each list's.

     The work is not done here, because it cannot be. A store is judged as
     it is read, before any rung runs, and the judge accepts one ID length.
     So the IDs are shortened where the data is read (shortId and the lift
     functions below), and then judged. Settings are lifted when their own
     number is below 4; settings stamped 4 holding a long ID are damaged.
     The roster and the jobs are always lifted (see liftRecordsCopy): the
     stamp lives in another key and can get ahead of them. A store whose
     copy on this phone still holds a long ID is named in proSchemaDirty at
     load, and the next save writes it, whatever the number already says. */
  4: function(){}
};
const proSchemaDirty = new Set();

/* ---------- schema 4: one ID, shortened the same way everywhere ----------
   A long ID was 16 random bytes. Its short form is the first 8 of them: the
   first ten characters, and the eleventh with its low two bits dropped.
   Half of a random value is as random as a fresh one of that size, and
   because the short ID follows from the long one, every place that holds an
   ID reaches the same answer on its own. localStorage, IndexedDB and a
   backup file are converted separately, in any order, and still agree; an
   app closed halfway through loses nothing. Anything that is not exactly a
   long ID is handed back untouched, so running it twice changes nothing.

   This reads the old shape only to convert it. Nothing is ever written,
   sent or validated with a long ID again. */
const LONG_ID_RE = /^[A-Za-z0-9_-]{21}[AQgw]$/;
const B64URL = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
let _shortened = 0;
function shortId(s){
  if(typeof s!=='string' || !LONG_ID_RE.test(s)) return s;
  _shortened++;
  return s.slice(0,10)+B64URL[B64URL.indexOf(s[10]) & 60];
}
function liftPair(p){ return isObj(p) ? Object.assign({}, p, { id:shortId(p.id) }) : p; }
function liftSettings(o){ return (isObj(o) && isObj(o.boss)) ? Object.assign({}, o, { boss:liftPair(o.boss) }) : o; }
function liftRecords(a){ return Array.isArray(a) ? a.map(liftPair) : a; }
/* A list comes back as the same object when it held no long ID. One that
   did loses its half-finished send, as a restore does: those links were
   made in the old format, and no phone opens them now. */
function liftList(o){
  if(!isObj(o)) return o;
  const n = _shortened;
  const out = Object.assign({}, o, { listId:shortId(o.listId), boss:liftPair(o.boss), job:liftPair(o.job) });
  if(Array.isArray(o.workers)) out.workers = o.workers.map(liftPair);
  if(Array.isArray(o.tasks)) out.tasks = o.tasks.map(t=>isObj(t) ? Object.assign({}, t, { worker:shortId(t.worker) }) : t);
  if(isObj(o.sent)){ out.sent = {}; Object.keys(o.sent).forEach(w=>{ out.sent[shortId(w)] = o.sent[w]; }); }
  if(_shortened===n) return o;
  out.queue = {};
  return out;
}

/* Absent means version 1. Anything that is not a sane number reads the same
   way: the conservative answer, never a guess upward. */
function proSchemaOf(o){
  const v = o && o.schemaVersion;
  return (typeof v==='number' && isFinite(v) && v>=1) ? Math.floor(v) : 1;
}
/* proSchemaReached is what the stamp will write: the version the data is
   actually IN, not the one this build hopes for. A rung that throws leaves
   the shape half-done, and stamping that "current" would hide the damage. */
let proSchemaReached = 1;
let schemaFromFuture = false;
function proApplySchema(from){
  schemaFromFuture = from > PRO_SCHEMA_VERSION;
  proSchemaReached = from;
  /* Newer than this build understands. Nothing is migrated, converted or
     written; the app shows a gate and waits for the update. */
  if(schemaFromFuture) return;
  for(let v=from+1; v<=PRO_SCHEMA_VERSION; v++){
    try{ const rung = PRO_MIGRATIONS[v]; if(rung) rung(); proSchemaReached = v; }
    catch(e){ console.warn('Notebuilt Pro: migration to schema v'+v+' did not complete', e); break; }
  }
}

/* ---------- load and save ----------
   Every write copies what is there to <key>__bak first, and a load that
   finds the main copy missing or damaged heals from that copy. A key whose
   main copy AND backup are both unreadable is never written over: the
   damaged original is the only evidence left, and the damaged gate says so. */
const unreadable = new Set();
function parse(raw){ if(raw==null) return undefined; try{ return JSON.parse(raw); }catch(e){ return undefined; } }
/* lift(value, isBackupCopy), when given, runs before the check: it is how
   data written before schema 4 gets its short IDs (above). */
function loadStore(k, ok, fallback, lift){
  const read = (name, bak)=>{ const v = parse(lsGet(name)); return (v!==undefined && lift) ? lift(v, bak) : v; };
  const raw = lsGet(k);
  if(raw!=null){ const v = read(k, false); if(v!==undefined && ok(v)) return v; }
  const b = read(k+'__bak', true);
  if(b!==undefined && ok(b)) return b;
  if(raw!=null) unreadable.add(k);
  return fallback();
}
function settingsOk(v){
  if(!isObj(v)) return false;
  if(proSchemaOf(v) > PRO_SCHEMA_VERSION) return true;       /* not this build's to judge */
  if(v.boss===undefined) return true;
  return isObj(v.boss) && typeof v.boss.id==='string' && typeof v.boss.name==='string'
      && bossValid(v.boss.id, v.boss.name).ok;
}
function hasIdentity(o){ return !!(isObj(o) && isObj(o.boss) && typeof o.boss.id==='string' && o.boss.id); }
function saveStore(k, value, opts){
  opts = opts || {};
  if(unreadable.has(k) && !opts.replace) return false;
  try{
    const current = localStorage.getItem(k);
    /* Never write nothing over something: a settings object with no ID must
       not replace one that has an ID unless a restore or a confirmed fresh
       start says so. A lost ID breaks resends of every list already sent. */
    if(k===K.settings && current!=null && !opts.replace && hasIdentity(parse(current)) && !hasIdentity(value)){
      console.warn('Notebuilt Pro: refused to write settings with no ID over settings that have one');
      return false;
    }
    /* The roster and the jobs only ever grow: nothing is deleted, only
       archived. A write that would shorten one is a bug or a wipe. */
    if((k===K.roster || k===K.jobs) && current!=null && !opts.replace){
      const cur = parse(current);
      if(Array.isArray(cur) && Array.isArray(value) && value.length<cur.length){
        console.warn('Notebuilt Pro: refused to write a shorter list over '+k);
        return false;
      }
    }
    if(current!=null) localStorage.setItem(k+'__bak', current);   /* backup before any write (Tier 1) */
    localStorage.setItem(k, JSON.stringify(value));
    unreadable.delete(k);
    return true;
  }catch(e){ console.warn('Notebuilt Pro: save failed', e); return false; }
}

/* ---------- crew and jobs: the record shapes ----------
   A worker is {id, name, note, archived, createdAt, updatedAt}; a job is the
   same with `address` in place of `note`. The id is permanent: minted once by
   the component when the record is made, and never changed by an edit. Times
   are epoch seconds. Nothing is ever deleted, only archived, because a list
   already sent still names the worker and the job by id.

   cleanRecord is the ONE judge of a record, for what is loaded from this
   phone and for what a backup file carries. It returns the record in a fixed
   key order, with unknown keys dropped, or null. */
const NOTE_MAX = 120, ADDRESS_MAX = 160;
const KINDS = {
  worker:{ key:'roster', extra:'note', extraMax:NOTE_MAX, max:1000 },
  job:{ key:'jobs', extra:'address', extraMax:ADDRESS_MAX, max:2000 }
};
const BAD_LINE_RE = /[\u0000-\u001f\u007f-\u009f\u2028\u2029]/;
function lineOk(s, max){ return typeof s==='string' && Array.from(s).length<=max && !BAD_LINE_RE.test(s); }
function timeOk(n){ return typeof n==='number' && Number.isInteger(n) && n>=0 && n<=4102444800; }
function cleanRecord(kind, o){
  const k = KINDS[kind];
  if(!isObj(o) || typeof o.id!=='string' || typeof o.name!=='string' || !bossValid(o.id, o.name).ok) return null;
  const extra = o[k.extra]===undefined ? '' : o[k.extra];
  if(!lineOk(extra, k.extraMax)) return null;
  if(o.archived!==undefined && typeof o.archived!=='boolean') return null;
  if(!timeOk(o.createdAt) || !timeOk(o.updatedAt)) return null;
  const r = { id:o.id, name:o.name };
  r[k.extra] = extra; r.archived = !!o.archived; r.createdAt = o.createdAt; r.updatedAt = o.updatedAt;
  return r;
}
function cleanRecords(kind, arr){
  if(!Array.isArray(arr) || arr.length>KINDS[kind].max) return null;
  const seen = new Set(), out = [];
  for(const o of arr){
    const r = cleanRecord(kind, o);
    if(!r || seen.has(r.id)) return null;        /* one bad record, or one id twice, refuses the lot */
    seen.add(r.id); out.push(r);
  }
  return out;
}

/* Settings carry their own number, written in the same setItem as the boss's
   ID, so the two cannot disagree: each copy is lifted by what it says.

   The roster and the jobs carry no number, and they are written separately
   from the one that describes them, so the number on this phone can never
   be trusted to say what shape they are in. A stage 3 build still open in
   another tab saves the crew without touching settings, after this build
   has stamped 4. If the number decided, that save would turn a crew this
   build can convert into one it refuses. So every copy of both is lifted,
   whatever the number says. It changes nothing in data that is already
   short. */
const liftSettingsCopy = v=>proSchemaOf(v)<4 ? liftSettings(v) : v;
const liftRecordsCopy = v=>liftRecords(v);
let settings = loadStore(K.settings, settingsOk, ()=>({}), liftSettingsCopy);
let roster = cleanRecords('worker', loadStore(K.roster, v=>!!cleanRecords('worker', v), ()=>[], liftRecordsCopy));
let jobs = cleanRecords('job', loadStore(K.jobs, v=>!!cleanRecords('job', v), ()=>[], liftRecordsCopy));
/* A store that was read, and whose copy on this phone still spells an ID
   the long way, is written by the next save, straight after the number. */
['roster','jobs'].forEach(name=>{
  const on = parse(lsGet(K[name]));
  if(!unreadable.has(K[name]) && Array.isArray(on) && on.some(o=>isObj(o) && LONG_ID_RE.test(o.id))) proSchemaDirty.add(name);
});
/* A store just written is no longer waiting to be. */
const wrote = (name, ok)=>{ if(ok) proSchemaDirty.delete(name); return ok; };
const write = { roster:opts=>wrote('roster', saveStore(K.roster, roster, opts)), jobs:opts=>wrote('jobs', saveStore(K.jobs, jobs, opts)) };
/* A store whose unreadable original the user chose to replace. */
const startedFresh = new Set();
/* Read at load. It migrates in memory only; the number waits for the next
   ordinary save to be stamped. */
proApplySchema(proSchemaOf(settings));

/* THE STAMP — here and nowhere else. It is only ever reached from something
   a person did, which is what keeps the number out of startup. The number
   goes first and the rest follows in a fixed order, so the same data always
   serialises to the same bytes. */
function stamp(opts){
  if(schemaFromFuture) return false;            /* never write a shape this build does not understand */
  const out = { schemaVersion:proSchemaReached };
  Object.keys(settings).forEach(k=>{ if(k!=='schemaVersion') out[k] = settings[k]; });
  if(!saveStore(K.settings, out, opts)) return false;
  settings = out;
  try{ if(localStorage.getItem(HARNESS_KEY)!=null) localStorage.removeItem(HARNESS_KEY); }catch(e){}
  return true;
}
/* What a rung changed in memory, written down AFTER the number (see the
   ladder). One that will not go down stays named and is tried again by the
   next save; this build reads it in either shape meanwhile. */
function flushMigrated(){
  for(const name of Array.from(proSchemaDirty)){
    if(write[name] && !write[name]()) console.warn('Notebuilt Pro: '+name+' is still in the old shape; the next save tries again');
  }
}
function saveSettings(opts){
  if(!stamp(opts)) return false;
  flushMigrated();
  return true;
}

/* A roster or jobs save, from a tap. If the number on this phone is behind,
   it goes down first, and if it will not, nothing is written: the store
   must never reach the new shape under the old number. Then the store,
   then whatever else is still waiting to be written in the new shape. */
function stampDue(){ return settings.schemaVersion!==proSchemaReached || proSchemaDirty.size>0; }
function commit(name){
  if(schemaFromFuture) return false;
  if(settings.schemaVersion!==proSchemaReached && !stamp()) return false;
  const key = K[name], fresh = startedFresh.has(key);
  if(!write[name](fresh ? { replace:true } : undefined)) return false;
  startedFresh.delete(key);
  flushMigrated();
  return true;
}

/* ---------- IndexedDB: opened only when something needs it, never at startup ---------- */
function idbOpen(){
  return new Promise((resolve, reject)=>{
    let req;
    try{ req = indexedDB.open(IDB_NAME, IDB_VERSION); }catch(e){ reject(e); return; }
    /* The store ladder. Each step runs once, for a database older than it.
         1: lists, keyed by listId. One record is the boss's full list for one
            job's day, with its sent map.
         2: reports, keyed by listId AND workerId: one record per worker per
            list, so two workers' reports never share a record. Version 1
            keyed it by listId alone and never wrote to it. The old store is
            dropped only after counting it empty; if it somehow holds
            anything, the upgrade aborts and nothing is touched.
         3: permanent IDs went from 128 bits to 64 (schema 4, below). Every
            list still holding a long ID is put back under its short listId
            with the short IDs inside it, in this one transaction: all of
            them or none. Two lists landing on one short listId fails the
            add, which aborts the upgrade and leaves everything as it was. */
    req.onupgradeneeded = function(ev){
      const db = req.result, tx = req.transaction;
      if(ev.oldVersion < 1) db.createObjectStore('lists', { keyPath:'listId' });
      if(ev.oldVersion < 2){
        const make = ()=>db.createObjectStore('reports', { keyPath:['listId','workerId'] });
        if(!db.objectStoreNames.contains('reports')) make();
        else {
          const c = tx.objectStore('reports').count();
          c.onsuccess = ()=>{ if(c.result>0){ tx.abort(); return; } db.deleteObjectStore('reports'); make(); };
        }
      }
      if(ev.oldVersion >= 1 && ev.oldVersion < 3){
        const st = tx.objectStore('lists'), all = st.getAll();
        all.onsuccess = ()=>{
          const moved = all.result.map(rec=>[rec, liftList(rec)]).filter(m=>m[1]!==m[0]);
          moved.forEach(m=>st.delete(m[0].listId));
          moved.forEach(m=>st.add(m[1]));
        };
      }
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
    req.onblocked = ()=>reject(new Error('blocked'));
  });
}
async function idbDump(){
  const db = await idbOpen();
  try{
    const out = {};
    for(const name of IDB_STORES){
      out[name] = await new Promise((resolve, reject)=>{
        const r = db.transaction(name,'readonly').objectStore(name).getAll();
        r.onsuccess = ()=>resolve(r.result); r.onerror = ()=>reject(r.error);
      });
    }
    return out;
  } finally { db.close(); }
}
async function idbReplace(crew){
  const db = await idbOpen();
  try{
    await new Promise((resolve, reject)=>{
      const tx = db.transaction(IDB_STORES,'readwrite');
      IDB_STORES.forEach(name=>{ const st = tx.objectStore(name); st.clear(); (crew[name]||[]).forEach(rec=>st.put(rec)); });
      tx.oncomplete = ()=>resolve(); tx.onerror = ()=>reject(tx.error); tx.onabort = ()=>reject(tx.error);
    });
  } finally { db.close(); }
}
async function idbPutList(rec){
  const db = await idbOpen();
  try{
    await new Promise((resolve, reject)=>{
      const tx = db.transaction('lists','readwrite');
      tx.objectStore('lists').put(rec);
      tx.oncomplete = ()=>resolve(); tx.onerror = ()=>reject(tx.error); tx.onabort = ()=>reject(tx.error);
    });
  } finally { db.close(); }
}
async function idbClearLists(){
  const db = await idbOpen();
  try{
    await new Promise((resolve, reject)=>{
      const tx = db.transaction('lists','readwrite');
      tx.objectStore('lists').clear();
      tx.oncomplete = ()=>resolve(); tx.onerror = ()=>reject(tx.error); tx.onabort = ()=>reject(tx.error);
    });
  } finally { db.close(); }
}

/* ============================================================
   Lists — one record is one job's day, for the whole crew (spec §4)
   ============================================================
   { listId, createdAt, updatedAt, boss:{id,name}, job:{id,name}, day,
     workers:[{id,name}], tasks:[{id, worker, text, order, editedAt, gone}],
     sent:{ <workerId>:{at, ids:[taskId…]} },
     queue:{ <workerId>:{sendId, at, parts:[{link, ids:[taskId…], done}]} } }

   workers, tasks and sent are the component's own shapes, and the component
   reads and writes them. `sent` is what each worker has been given: it is
   what lets a resend carry a tombstone. `queue` is a send that has started
   and not finished: the exact links, so every part of one send goes out
   under one sendId even if the app is closed halfway through.

   A task is never removed. Cancelling sets gone:'cancelled' and keeps it;
   reassigning changes its worker, and the component turns that into a
   tombstone in the slice of the worker it left.

   cleanList is the ONE judge of a list, for what is loaded from this phone
   and for what a backup carries. Everything the component defines goes
   through the component's validator; the rest is checked here. It returns
   the record in a fixed key order, with unknown keys dropped, or null. A
   backup never carries a half-finished send, so a file's queue is dropped. */
const LISTS_MAX = 5000;
const PARTS_MAX = EGSCrew.LIMITS.tasks + EGSCrew.LIMITS.workers;
const SEND_ID_RE = /^[A-Za-z0-9_-]{8}$/;
function cleanList(o, fromFile){
  if(!isObj(o) || typeof o.listId!=='string' || !timeOk(o.createdAt) || !timeOk(o.updatedAt) || !isObj(o.sent)) return null;
  const v = EGSCrew.validate({ f:EGSCrew.FORMAT, v:EGSCrew.VERSION, k:'list', listId:o.listId, issuedAt:1790000000,
    sendId:PROBE.send, part:1, parts:1, boss:o.boss, job:o.job, day:o.day, mode:'crew', workers:o.workers, tasks:o.tasks }, 'list');
  if(!v.ok) return null;
  const L = v.value, wids = new Set(L.workers.map(w=>w.id)), tids = new Set(L.tasks.map(t=>t.id));
  /* 'reassigned' is only ever made for a slice. The boss's own copy never holds it. */
  if(L.tasks.some(t=>t.gone==='reassigned')) return null;
  const idList = a=>Array.isArray(a) && a.length<=tids.size && a.every(i=>typeof i==='string' && tids.has(i)) && new Set(a).size===a.length;
  const sent = {};
  for(const wid of Object.keys(o.sent).sort()){
    const s = o.sent[wid];
    if(!wids.has(wid) || !isObj(s) || !timeOk(s.at) || !idList(s.ids)) return null;
    sent[wid] = { at:s.at, ids:s.ids.slice().sort() };
  }
  const queue = {};
  if(!fromFile && o.queue!==undefined){
    if(!isObj(o.queue)) return null;
    for(const wid of Object.keys(o.queue).sort()){
      const q = o.queue[wid];
      if(!wids.has(wid) || !isObj(q) || typeof q.sendId!=='string' || !SEND_ID_RE.test(q.sendId) || !timeOk(q.at) || q.at<1
         || !Array.isArray(q.parts) || !q.parts.length || q.parts.length>PARTS_MAX) return null;
      const parts = [];
      for(const p of q.parts){
        if(!isObj(p) || typeof p.link!=='string' || p.link.length>EGSCrew.SAFE_LINK_CHARS || p.link.indexOf(EGSCrew.LINK.list)!==0
           || !EGSCrew.fromHash('#crew='+p.link.slice(EGSCrew.LINK.list.length), 'list') || !idList(p.ids) || typeof p.done!=='boolean') return null;
        parts.push({ link:p.link, ids:p.ids.slice(), done:p.done });
      }
      queue[wid] = { sendId:q.sendId, at:q.at, parts:parts };
    }
  }
  return { listId:L.listId, createdAt:o.createdAt, updatedAt:o.updatedAt, boss:L.boss, job:L.job, day:L.day,
    workers:L.workers.slice().sort((a,b)=>a.id<b.id ? -1 : a.id>b.id ? 1 : 0),
    tasks:L.tasks.slice().sort(taskOrder), sent:sent, queue:queue };
}
function taskOrder(a, b){ return a.order-b.order || parseInt(a.id,36)-parseInt(b.id,36); }
function cleanLists(arr, fromFile){
  if(!Array.isArray(arr) || arr.length>LISTS_MAX) return null;
  const ids = new Set(), days = new Set(), out = [];
  for(const o of arr){
    const r = cleanList(o, fromFile);
    /* One bad list, one id twice, or two lists for one job's day refuses the lot. */
    if(!r || ids.has(r.listId) || days.has(r.job.id+'|'+r.day)) return null;
    ids.add(r.listId); days.add(r.job.id+'|'+r.day); out.push(r);
  }
  return out;
}

/* Lists are read once there is a name, never on the first-run screen, and
   kept in memory. idle -> loading -> ready, or:
     failed  — the database would not open. Nothing is shown or changed.
     damaged — a stored list failed the check. They are left untouched. */
let lists = [];
let listsState = 'idle';
/* Bumped by anything a measured send depends on: a list's tasks, and the
   names. A measurement made under an older number is thrown away. */
let rev = 0;
function listsNeed(){ if(listsState==='idle'){ listsState = 'loading'; listsLoad(); } }
async function listsLoad(){
  let got = null, state = 'failed';
  try{ got = cleanLists((await idbDump()).lists, false); state = got ? 'ready' : 'damaged'; }
  catch(e){ console.warn('Notebuilt Pro: could not read the lists', e); }
  lists = got || []; listsState = state; rev++;
  if(!gate()) render();
}
function listFind(jobId, day){ return lists.find(l=>l.job.id===jobId && l.day===day) || null; }
/* The names a list goes out under are the ones on this phone now: a rename
   in Crew, Jobs or Settings reaches the next send. The ids never move. */
function nameRefresh(o){
  if(hasIdentity(settings) && settings.boss.id===o.boss.id) o.boss.name = settings.boss.name;
  const j = jobs.find(x=>x.id===o.job.id); if(j) o.job.name = j.name;
  o.workers.forEach(w=>{ const r = roster.find(x=>x.id===w.id); if(r) w.name = r.name; });
  return o;
}
function listLive(rec){ return nameRefresh(JSON.parse(JSON.stringify(rec))); }
/* Put a list down. `quiet` is for a write that changes no task and no name:
   a tick, or a send being started. */
async function listPut(next, quiet){
  if(listsState!=='ready' || schemaFromFuture) return false;
  const rec = cleanList(next, false);
  if(!rec) return false;
  const old = lists.find(l=>l.listId===rec.listId) || null;
  if(old){
    /* A list only grows: a task is cancelled, never removed, and what a
       worker has been given is never forgotten. A write that would drop
       either is a bug or a wipe. */
    const ids = new Set(rec.tasks.map(t=>t.id));
    if(old.tasks.some(t=>!ids.has(t.id))
       || Object.keys(old.sent).some(w=>!rec.sent[w] || old.sent[w].ids.some(i=>rec.sent[w].ids.indexOf(i)<0))){
      console.warn('Notebuilt Pro: refused a list write that would drop a task or a sent record');
      return false;
    }
  } else if(listFind(rec.job.id, rec.day)) return false;
  try{ await idbPutList(rec); }catch(e){ console.warn('Notebuilt Pro: list save failed', e); return false; }
  lists = old ? lists.map(l=>l.listId===rec.listId ? rec : l) : lists.concat([rec]);
  if(!quiet) rev++;
  if(stampDue()) saveSettings();
  return true;
}
/* One list change at a time, each built on the last one written. */
let _listQ = Promise.resolve();
const SAVE_FAIL = 'I couldn’t save that on this phone. Nothing was changed.';
const NOTHING = 'nothing';     /* a change that turned out to change nothing: not an error, not a write */
/* change(rec, now) edits a copy and returns null, NOTHING, or a sentence
   saying why not. Resolves the same way: null means it was written. */
function listEdit(jobId, day, change, quiet){
  const p = _listQ.then(async ()=>{
    if(listsState!=='ready') return 'I can’t read the lists on this phone, so I didn’t change anything.';
    const old = listFind(jobId, day), job = jobs.find(j=>j.id===jobId), t = nowSec();
    if(!old && (!job || !dayOk(day) || !hasIdentity(settings))) return SAVE_FAIL;
    const rec = old ? JSON.parse(JSON.stringify(old))
      : { listId:EGSCrew.newId(), createdAt:t, updatedAt:t, boss:{ id:settings.boss.id, name:settings.boss.name },
          job:{ id:job.id, name:job.name }, day:day, workers:[], tasks:[], sent:{}, queue:{} };
    const why = change(rec, t);
    if(why) return why;
    rec.updatedAt = Math.max(t, rec.updatedAt); nameRefresh(rec);
    return (await listPut(rec, quiet)) ? null : SAVE_FAIL;
  });
  _listQ = p.catch(()=>{});
  return p;
}

/* ---------- tasks: the boss's fields (text, order, worker, gone) ---------- */
/* The time an edit carries. It is later than the task's last edit, and later
   than every send on this list, so "edited since their last send" can never
   miss an edit made in the same second as the send. */
function editStamp(rec, prev, now){
  let floor = prev||0;
  Object.keys(rec.sent).forEach(w=>{ floor = Math.max(floor, rec.sent[w].at); });
  Object.keys(rec.queue).forEach(w=>{ floor = Math.max(floor, rec.queue[w].at); });
  return EGSCrew.stamp(floor, now);
}
/* The component is the only judge of what task text is. */
function taskTextCheck(raw){
  const text = String(raw==null ? '' : raw).trim();
  if(!text) return { ok:false, msg:'Type the task first.' };
  const v = EGSCrew.validate(probeList({ boss:'A', job:'A', worker:'A' }, text), 'list');
  if(v.ok) return { ok:true, text:text };
  const d = v.detail || '';
  return { ok:false, msg:d.indexOf('too long')>=0 ? 'A task can be up to '+EGSCrew.LIMITS.text+' characters. This one is '+Array.from(text).length+'.'
    : d.indexOf('markup')>=0 ? 'A task can’t contain markup like <b>.'
    : d.indexOf('forbidden')>=0 ? 'A task can’t contain line breaks or control characters.' : 'That task doesn’t check out.' };
}
/* Put a worker on the list if they are not on it. Only someone still on the
   crew can be given a task; whoever already holds one stays as they are. */
function listSeat(rec, wid){
  if(rec.workers.some(x=>x.id===wid)) return null;
  const w = roster.find(x=>x.id===wid && !x.archived);
  if(!w) return 'Pick who it’s for.';
  if(rec.workers.length>=EGSCrew.LIMITS.workers) return 'One day’s list holds up to '+EGSCrew.LIMITS.workers+' people.';
  rec.workers.push({ id:w.id, name:w.name });
  return null;
}
function lastOrder(rec){ return rec.tasks.reduce((m,x)=>Math.max(m, x.order), 0); }
function taskAdd(rec, now, text, wid){
  if(!roster.some(x=>x.id===wid && !x.archived)) return 'Pick who it’s for.';
  if(rec.tasks.length>=EGSCrew.LIMITS.tasks) return 'One day’s list holds up to '+EGSCrew.LIMITS.tasks+' tasks, counting cancelled ones.';
  const why = listSeat(rec, wid); if(why) return why;
  rec.tasks.push({ id:EGSCrew.nextTaskId(rec), worker:wid, text:text, order:lastOrder(rec)+1, editedAt:editStamp(rec, 0, now), gone:null });
  delete rec.queue[wid];
  return null;
}
function taskChange(rec, now, tid, text, wid){
  const k = rec.tasks.find(x=>x.id===tid);
  if(!k || k.gone) return 'That task isn’t on the list any more.';
  if(k.text===text && k.worker===wid) return NOTHING;
  if(k.worker!==wid){
    const why = listSeat(rec, wid); if(why) return why;
    /* A send to either of them that has started is now out of date. */
    delete rec.queue[wid];
    k.order = lastOrder(rec)+1;                  /* it joins the end of the new person's tasks */
  }
  delete rec.queue[k.worker];
  k.text = text; k.worker = wid; k.editedAt = editStamp(rec, k.editedAt, now);
  return null;
}
function taskGone(rec, now, tid, flag){
  const k = rec.tasks.find(x=>x.id===tid);
  if(!k || !!k.gone===flag) return NOTHING;
  k.gone = flag ? 'cancelled' : null; k.editedAt = editStamp(rec, k.editedAt, now);
  delete rec.queue[k.worker];
  return null;
}
function taskMove(rec, now, tid, dir){
  const k = rec.tasks.find(x=>x.id===tid);
  if(!k || k.gone) return NOTHING;
  const mine = rec.tasks.filter(x=>x.worker===k.worker && !x.gone).sort(taskOrder), other = mine[mine.indexOf(k)+dir];
  if(!other) return NOTHING;
  if(k.order===other.order){
    /* Two tasks on one order number can only come from a file. Number the
       whole list as it is shown, then swap. */
    rec.tasks.slice().sort(taskOrder).forEach((x,i)=>{ if(x.order!==i+1){ x.order = i+1; x.editedAt = editStamp(rec, x.editedAt, now); delete rec.queue[x.worker]; } });
  }
  const o = k.order; k.order = other.order; other.order = o;
  k.editedAt = editStamp(rec, k.editedAt, now); other.editedAt = editStamp(rec, other.editedAt, now);
  delete rec.queue[k.worker];
  return null;
}

/* ---------- sending: who has what ---------- */
/* Everyone a list has something for: a live task, something already given
   (which a tombstone may have to follow), or a send in progress. */
function sendWorkers(rec){
  const on = new Set();
  rec.tasks.forEach(t=>{ if(!t.gone) on.add(t.worker); });
  Object.keys(rec.sent).forEach(w=>{ if(rec.sent[w].ids.length) on.add(w); });
  Object.keys(rec.queue).forEach(w=>on.add(w));
  return rec.workers.filter(w=>on.has(w.id)).sort(byName);
}
/* new — nothing has gone to them. changed — something has, and the list has
   moved since. part — a send has started. sent — they have everything.
   A worker counts as sent only when every part of the send is ticked. */
function sendState(rec, wid){
  const q = rec.queue[wid], s = rec.sent[wid];
  if(q) return { k:'part', done:q.parts.filter(p=>p.done).length, parts:q.parts.length };
  if(!s || EGSCrew.changesNotSent(rec, wid, rec.sent)) return { k:(s && s.ids.length) ? 'changed' : 'new' };
  return { k:'sent', at:s.at };
}
function sendPill(st){
  const label = st.k==='sent' ? 'Sent '+sentLabel(st.at) : st.k==='changed' ? 'Changes not sent'
    : (st.k==='part' && st.done) ? st.done+' of '+st.parts+' sent' : 'Not sent';
  return '<span class="pill" data-state="'+st.k+'">'+esc(label)+'</span>';
}
function sentLabel(at){
  const d = new Date(at*1000), n = new Date();
  return d.toDateString()===n.toDateString() ? d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' })
    : d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
}
function dayLabel(day){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(day); if(!m) return '';
  return new Date(+m[1], +m[2]-1, +m[3]).toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
}
function partLabel(name, i, n){ return name+'’s list'+(n>1 ? ', part '+(i+1)+' of '+n : ''); }

/* Measured before the share sheet opens (spec §5, rule 12). For every worker
   with something to send, the component builds their private slice and
   split() turns it into the fewest links that each fit, or refuses with its
   cause. The result waits here until Send is tapped; nothing is stored. */
const _prep = { key:'', rev:-1, busy:false, by:{}, force:{} };
/* Why a worker's last Send didn't go. In memory only; shown while the rev it
   was made under stands and that part is unticked. */
const sendNote = {};
function prepFor(stored){
  if(_prep.key===stored.listId && _prep.rev===rev) return;
  if(_prep.key!==stored.listId){ _prep.by = {}; _prep.force = {}; }
  _prep.key = stored.listId; _prep.rev = rev; _prep.busy = true;
  const key = stored.listId, mine = rev, live = listLive(stored);
  (async ()=>{
    const by = {};
    /* Not before the newest edit: an edit can carry a time a second or two
       ahead of the clock, and the send has to count as covering it. */
    const at = live.tasks.reduce((m,t)=>Math.max(m, t.editedAt), nowSec());
    for(const w of sendWorkers(live)){
      if(live.queue[w.id]) continue;
      if(!_prep.force[w.id] && !EGSCrew.changesNotSent(live, w.id, live.sent)) continue;
      let r;
      try{
        const slice = EGSCrew.sliceFor(live, w.id, live.sent, at);
        r = await EGSCrew.split(slice);
        if(r.ok) r = { ok:true, sendId:r.sendId, at:slice.issuedAt,
          parts:r.parts.map(p=>({ link:p.link, ids:p.value.tasks.filter(t=>!t.gone).map(t=>t.id), done:false })) };
      }catch(e){ r = { ok:false, code:'invalid', reason:EGSCrew.REASONS.invalid }; }
      by[w.id] = r;
    }
    if(_prep.key!==key || mine!==rev) return;          /* the list moved on while this was measuring */
    _prep.by = by; _prep.busy = false;
    if(!gate() && routeOf(view).base==='send') render();
  })();
}

/* ============================================================
   EGS-STD:themes — day, night, and follow-the-phone
   ============================================================
   The <head> script did the first frame. This half is the toggle and the
   status bar. themeMode() is a pure read; the only writer is setTheme, and
   only a tap reaches it. */
function themeMode(){ const m = lsGet(DEVICE.theme); return (m==='light'||m==='dark') ? m : 'system'; }
const THEME_LABEL = { light:'Day', dark:'Night', system:'Auto' };
function themeIsDark(){
  const m = themeMode();
  if(m!=='system') return m==='dark';
  return !(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme', themeMode());
  const bar = window.NP_THEME_BAR || { dark:'#15181D', light:'#F6F3EC' };
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', themeIsDark() ? bar.dark : bar.light);
}
function setTheme(mode){
  if(mode!=='light' && mode!=='dark') mode = 'system';
  lsSet(DEVICE.theme, mode); applyTheme();
}
if(window.matchMedia){
  const mq = window.matchMedia('(prefers-color-scheme: light)');
  const onSys = ()=>{ if(themeMode()==='system') applyTheme(); };
  if(mq.addEventListener) mq.addEventListener('change', onSys); else if(mq.addListener) mq.addListener(onSys);
}

/* ============================================================
   One back resolver, hash-carried view state (the Sep 27 standard)
   ============================================================
   history.state = {np:1, v:view, d:depth, g:guard?, o:overlay?, y:scroll}.
   The stack is [guard d0, home d1, deeper views, the sheet of the top view].
   popstate is the ONLY back path: the header arrow is history.back(). Every
   overlay owns an entry while it is open, so closing one is a natural pop.
   Every history mutation queues behind an in-flight history.go(). The hash
   and the remembered view are untrusted input: a view is one of a constant
   set or it is Home. */
const NAV_VIEWS = new Set(['home','crew','jobs','day','settings','support','privacy']);
/* Two views are about one job's day and carry it: day/<jobId>/<day> builds
   the list and send/<jobId>/<day> sends it. */
const NAV_PARAM = new Set(['day','send']);
const NAV_ROOT = 'home';
const NAV_EXIT_MS = 2000;
let view = NAV_ROOT;
let _navBase = 0, _navExpect = 0, _navExpectT = null, _navQ = [], _navExitT = null;
let _bootReport = false;

function dayOk(s){
  return typeof s==='string' && EGSCrew.validate(Object.assign(probeList({ boss:'A', job:'A', worker:'A' }, 'A'), { day:s }), 'list').ok;
}
function routeOf(v){ const p = String(v).split('/'); return { base:p[0], jobId:p[1]||null, day:p[2]||null }; }
/* A route is a view's name, or one of the two above for a job that is on
   this phone and a day the component accepts. Anything else is not a route. */
function navValid(v){
  if(typeof v!=='string' || v.length>48) return null;
  const m = /^([a-z]{1,12})(?:\/([A-Za-z0-9_-]{11})\/(\d{4}-\d{2}-\d{2}))?$/.exec(v);
  if(!m) return null;
  if(!m[2]) return NAV_VIEWS.has(m[1]) ? v : null;
  return (NAV_PARAM.has(m[1]) && dayOk(m[3]) && jobs.some(j=>j.id===m[2])) ? v : null;
}
function navParseHash(h){ return (typeof h==='string' && h.slice(0,2)==='#/') ? navValid(h.slice(2)) : null; }
function navHash(v){ return '#/'+v; }
function navEntry(v,d){ return { np:1, v:v, d:d }; }
function navState(){ const s = history.state; return (s && s.np===1) ? s : null; }
function navOp(fn){ if(_navExpect) _navQ.push(fn); else fn(); }
function navFlush(){ while(_navQ.length && !_navExpect) _navQ.shift()(); }
function navTraverse(n){
  if(!n) return;
  _navExpect++;
  clearTimeout(_navExpectT);
  /* history.go() past either end fires no popstate; never wait forever. */
  _navExpectT = setTimeout(()=>{ _navExpect = 0; navFlush(); }, 1500);
  history.go(n);
}
/* Leave the guard: put the Home entry back above it. */
function navUnguard(){
  if(_navExitT){ clearTimeout(_navExitT); _navExitT = null; }
  const s = navState(); if(!s || !s.g || s.unseeded) return;
  history.pushState(navEntry(NAV_ROOT,1), '', navHash(NAV_ROOT)); _navBase = 1;
}
function rememberView(){ lsSet(DEVICE.view, navHash(view)); }   /* only ever called from a navigation */
function navShow(name, y){ view = name; render(); window.scrollTo(0, y||0); }

function go(name){
  name = navValid(name) || NAV_ROOT;
  if(sheetIsOpen() && !closeSheet()) return;
  if(name!==view && !leaveOk()) return;
  const y = window.scrollY;
  navOp(()=>{
    const s = navState(); if(!s || s.unseeded) return;
    navUnguard();
    const s1 = navState();
    if(name===NAV_ROOT){
      if(s1.d<=1){ history.replaceState(navEntry(name,1), '', navHash(name)); _navBase = 1; }
      else { navTraverse(1-s1.d); navOp(()=>{ history.replaceState(navEntry(name,1), '', navHash(name)); _navBase = 1; }); }
    } else {
      if(!s1.o) history.replaceState(Object.assign({}, s1, {y:y}), '');
      history.pushState(navEntry(name, s1.d+1), '', navHash(name)); _navBase = s1.d+1;
    }
  });
  navShow(name, 0); rememberView();
}
/* The header arrow. The same path as the phone's back button. */
function navBack(){
  navOp(()=>{
    const s = navState();
    if(s && !s.g && !s.unseeded && s.d>1) history.back();
    else go(NAV_ROOT);
  });
}
function navArmExit(){
  toast('Press back again to exit');
  clearTimeout(_navExitT);
  _navExitT = setTimeout(()=>{ _navExitT = null; navOp(navUnguard); }, NAV_EXIT_MS);
}
/* A cold stack: seeded once, at the first render past the gates. The parent
   chain is used ONLY to seed. Back never consults it. */
function navSeed(){
  const r = routeOf(view);
  const chain = view===NAV_ROOT ? [NAV_ROOT]
    : r.jobId ? (r.base==='send' ? [NAV_ROOT,'day','day/'+r.jobId+'/'+r.day,view] : [NAV_ROOT,'day',view])
    : ((view==='support'||view==='privacy') ? [NAV_ROOT,'settings',view] : [NAV_ROOT,view]);
  history.replaceState({ np:1, g:1, d:0, v:NAV_ROOT }, '', navHash(NAV_ROOT));
  chain.forEach((v,i)=>history.pushState(navEntry(v,i+1), '', navHash(v)));
  _navBase = chain.length;
}
/* An entry this app did not write: someone tapped a link into the open app,
   or edited the hash. Adopt it as an ordinary view entry so back still works,
   and never leave a payload sitting in the address (spec rule 5). */
function navForeign(){
  const isReport = /^#report=/.test(location.hash);
  if(gate()){
    history.replaceState({ np:1, g:1, d:0, v:NAV_ROOT, unseeded:1 }, '', navHash(NAV_ROOT));
    return;
  }
  if(sheetIsOpen() && sheetDirty()){
    /* Unsaved typing stays put. The entry is adopted as the sheet's own, so
       the address is clean and back still closes the sheet. */
    history.replaceState({ np:1, v:view, d:_navBase+2, o:'sheet' }, '', navHash(view));
    toast(isReport ? 'Save or close this first, then tap the report link again.' : 'Save or close this first.');
    return;
  }
  if(!sheetIsOpen() && composerDirty()){
    /* The same for a task typed and not yet added. */
    _navBase = _navBase+1;
    history.replaceState(navEntry(view,_navBase), '', navHash(view));
    toast(isReport ? 'Add or clear the task you typed first, then tap the report link again.' : 'Add or clear the task you typed first.');
    return;
  }
  const t = isReport ? NAV_ROOT : (navParseHash(location.hash) || view);
  if(sheetIsOpen()) hideSheet();
  _navBase = _navBase+1;
  history.replaceState(navEntry(t,_navBase), '', navHash(t));
  navShow(t, 0);
  if(isReport) reportNotYet();
}
/* THE back resolver. */
function navOnPop(e){
  if(_navExpect){ _navExpect--; if(!_navExpect){ clearTimeout(_navExpectT); navFlush(); } return; }
  const s = (e.state && e.state.np===1) ? e.state : null;
  if(!s){ navForeign(); return; }
  if(gate()) return;
  if(sheetIsOpen()){
    /* Back closes the sheet. With unsaved typing it asks first, and a "no"
       puts the sheet's entry back: the one place an entry is re-pushed,
       because the phone's back cannot be refused, only undone. */
    if(!discardOk()){
      if(!s.o) history.pushState({ np:1, v:view, d:s.d+1, o:'sheet' }, '', navHash(view));
      return;
    }
    hideSheet();
  }
  if(s.o){ navTraverse(-1); return; }            /* forward onto a closed sheet's entry: step off it */
  /* Leaving a screen with a task typed and not added asks first, and a "no"
     steps back onto the entry that was just left. */
  if((s.g || (navValid(s.v) || NAV_ROOT)!==view) && s.d!==_navBase && !leaveOk()){ navTraverse(_navBase-s.d); return; }
  if(s.g){
    /* Onto the guard: stay, say so, and let a second press leave. */
    history.replaceState({ np:1, g:1, d:0, v:NAV_ROOT }, '', navHash(NAV_ROOT));
    _navBase = 0;
    if(view!==NAV_ROOT) navShow(NAV_ROOT, 0);
    navArmExit();
    return;
  }
  _navBase = s.d;
  /* Back onto another entry of the screen already showing, with a task typed:
     nothing to draw, and drawing would wipe the field. */
  if((navValid(s.v) || NAV_ROOT)===view && composerDirty()) return;
  navShow(navValid(s.v) || NAV_ROOT, s.y);
  rememberView();
}
function navBoot(){
  window.addEventListener('popstate', navOnPop);
  _bootReport = /^#report=/.test(location.hash);
  const s = navState();
  if(s && !s.unseeded && !gate()){
    /* A reload in the same session (the update banner's Refresh): the stack
       below is still this app's. Re-validate what it names. */
    view = navValid(s.v) || NAV_ROOT;
    if(s.o){ _navBase = s.d-1; navTraverse(-1); }
    else if(s.g){ _navBase = 0; navUnguard(); }
    else _navBase = s.d;
    return;
  }
  let t = gate() ? null : navParseHash(location.hash);
  /* The remembered screen is for an ordinary cold open. A report link lands on Home. */
  if(!t && !gate() && !_bootReport) t = navParseHash(lsGet(DEVICE.view));
  view = t || NAV_ROOT; _navBase = 0;
  /* One entry until the first render past the gates seeds the rest. This
     also swaps a #report= payload out of the address. */
  history.replaceState({ np:1, g:1, d:0, v:view, unseeded:1 }, '', navHash(view));
}

/* ---------- sheets ---------- */
function sheetIsOpen(){ return !!$mr.innerHTML; }
function hideSheet(){ $mr.innerHTML = ''; }
function sheet(html){
  $mr.innerHTML = '<div class="scrim" data-action="sheet-scrim"><div class="sheet" role="dialog" aria-modal="true">'+html+'</div></div>';
  navOp(()=>{
    let s = navState(); if(!s || s.unseeded || s.o) return;
    if(s.g){ navUnguard(); s = navState(); }
    history.pushState({ np:1, v:view, d:s.d+1, o:'sheet' }, '', navHash(view));
  });
}
/* Unsaved typing. A field that can be edited in a sheet carries data-orig,
   the value it opened with; the sheet is dirty when any of them now differs.
   Losing typed text is a small delete, so every way out of a dirty sheet
   asks first: its scrim, the phone's back, a help marker, Archive. Only a
   successful save leaves without asking. */
function sheetDirty(){
  return Array.prototype.some.call($mr.querySelectorAll('input[data-orig]'), i=>i.value.trim()!==i.dataset.orig);
}
function discardOk(){
  return !sheetDirty() || confirm('Discard what you typed? It hasn\u2019t been saved.');
}
/* The Day screen's own field is not in a sheet. A task typed there and not
   added is lost by leaving the screen, so leaving asks the same way. */
function composerDirty(){ const i = document.getElementById('task-new'); return !!(i && i.value.trim()); }
function leaveOk(){ return !composerDirty() || confirm('Discard the task you typed? It hasn\u2019t been added.'); }
/* Returns false if the sheet stayed open. `saved` is for the caller that has
   just written the sheet's fields down, so there is nothing left to lose. */
function closeSheet(saved){
  if(!sheetIsOpen()) return true;
  if(!saved && !discardOk()) return false;
  hideSheet();
  /* Step off the sheet's entry. A link tapped while it was open can leave it
     owning two, so keep stepping until the entry is a view's. */
  navOp(function step(){ const s = navState(); if(s && s.o){ navTraverse(-1); navOp(step); } });
  return true;
}
function reportNotYet(){
  sheet('<h2>A crew report</h2><p>That link is a report from one of your crew. This build can’t read reports yet, so I didn’t open it and nothing was changed.</p>'
    +'<p class="muted">Keep the text message. The link will still work once reports are built in.</p>'
    +'<button class="btn block" data-action="sheet-close">OK</button>');
}

}
function listsNotReady(){
  if(listsState==='damaged'){
    return '<div class="card prose">I can\u2019t read the lists saved on this phone, so I\u2019ve left them untouched. Restoring a backup brings them back.</div>'
      +'<button class="btn block" data-go="support">Support &amp; Backup</button>'
      +'<button class="btn danger block" style="margin-top:12px" data-action="lists-fresh">Start again with no lists</button>';

  }

/* How many people on a list still have something not sent. */
function listUnsent(l){ return sendWorkers(l).filter(w=>sendState(l, w.id).k!=='sent').length; }
function listRow(l, when){
  const n = l.tasks.filter(t=>!t.gone).length, u = listUnsent(l);

/* Everything under the field. Drawn on its own after a change, so adding a
   task never rebuilds the field and the keyboard stays up. */
function dayBody(r){
  const stored = listFind(r.jobId, r.day);
  if(!stored || !stored.tasks.length) return '<div class="card prose" style="margin-top:14px">No tasks yet. Tap who it\u2019s for, type the task, and add it.</div>';
  const rec = listLive(stored), ws = sendWorkers(rec), unsent = listUnsent(rec);
  let h = '<div style="margin-top:16px"><button class="btn block'+(unsent ? ' primary' : '')+'" data-action="send-open">Send lists</button>'
    +'<div class="sub" id="day-status" style="margin-top:8px">'+esc(!ws.length ? 'Nobody has a task on this list.' : unsent ? (unsent===1 ? '1 person has' : unsent+' people have')+' something not sent.' : 'Everything is sent.')+'</div></div>';
  ws.forEach(w=>{
    const mine = rec.tasks.filter(t=>t.worker===w.id && !t.gone);
    h += '<div class="grp" data-wid="'+esc(w.id)+'"><span class="who">'+esc(w.name)+'</span>'+sendPill(sendState(rec, w.id))+'</div>';
    if(!mine.length){ h += '<div class="sub">No tasks now. They\u2019ll be told on the next send.</div>'; return; }
    h += '<div class="list tasks" data-wid="'+esc(w.id)+'">'+mine.map((t,i)=>'<div class="task" data-id="'+esc(t.id)+'">'
      +'<button class="task-text" data-action="task-edit" data-id="'+esc(t.id)+'">'+esc(t.text)+'</button>'
      +'<button class="mv" data-action="task-up" data-id="'+esc(t.id)+'" aria-label="Move up"'+(i===0 ? ' disabled' : '')+'>'+I.up+'</button>'
      +'<button class="mv" data-action="task-down" data-id="'+esc(t.id)+'" aria-label="Move down"'+(i===mine.length-1 ? ' disabled' : '')+'>'+I.down+'</button>'
      +'</div>').join('')+'</div>';
  });
  const gone = rec.tasks.filter(t=>t.gone);
  if(gone.length){
    const who = id=>{ const w = rec.workers.find(x=>x.id===id); return w ? w.name : 'someone'; };
    h += '<div class="grp"><span class="who muted">Cancelled</span></div><div class="list" id="day-gone">'
      +gone.map(t=>'<button data-action="task-edit" data-id="'+esc(t.id)+'"><span class="grow"><span class="gone-text">'+esc(t.text)+'</span>'
        +'<br><span class="sub">'+esc('Was '+who(t.worker)+'\u2019s')+'</span></span><span class="chev">'+I.chevronR+'</span></button>').join('')+'</div>';
  }
  return h;
}

async function addTask(){
  const r = routeOf(view), input = document.getElementById('task-new');
  if(!input || !r.jobId) return;

  if(!c.ok){ taskMsg('task-new-msg', c.msg); input.focus(); return; }
  if(!dayWho){ taskMsg('task-new-msg', 'Tap who it\u2019s for first.'); return; }

  if(why){ taskMsg('task-new-msg', why); return; }
  const now = document.getElementById('task-new');
  if(now && view==='day/'+r.jobId+'/'+r.day){ now.value = ''; taskMsg('task-new-msg', ''); listRedraw(); now.focus(); }

function openTask(tid){

  if(t.gone){
    sheet('<h2>Cancelled task</h2><p>'+esc(t.text)+'</p><p class="muted">'+esc('It was '+(owner ? owner.name : 'someone')+'\u2019s. Nothing was deleted.')+'</p>'
      +'<button class="btn primary block" data-action="task-restore" data-id="'+esc(t.id)+'">Bring back</button>');
    return;
  }
  /* Whoever holds it stays on offer, even if they have since been archived. */
  const people = roster.filter(w=>!w.archived || w.id===t.worker).sort(byName);
  sheet(helpMark('task', true)+'<h2>Change a task</h2>'

    +'<div class="field-msg bad" id="task-text-msg" aria-live="polite"></div>'

}
async function saveTask(tid){
  const r = routeOf(view), input = document.getElementById('task-text'), who = document.getElementById('task-who');
  if(!input || !who || !r.jobId) return;
  const c = taskTextCheck(input.value);
  if(!c.ok){ taskMsg('task-text-msg', c.msg); input.focus(); return; }
  const why = await listEdit(r.jobId, r.day, (rec, now)=>taskChange(rec, now, tid, c.text, who.value));
  if(why && why!==NOTHING){ taskMsg('task-text-msg', why); return; }

async function cancelTask(tid, flag){
  const r = routeOf(view), stored = r.jobId ? listFind(r.jobId, r.day) : null;
  const t = stored && stored.tasks.find(x=>x.id===tid);
  if(!t) return;
  if(flag){
    /* Cancel acts on the saved task, so words typed and not saved would be lost. */
    if(!discardOk()) return;
    const rec = listLive(stored), owner = rec.workers.find(w=>w.id===t.worker), name = owner ? owner.name : 'They';
    const had = !!(stored.sent[t.worker] && stored.sent[t.worker].ids.indexOf(tid)>=0) || !!stored.queue[t.worker];
    /* Cancelling is this screen's delete, so it asks first. Nothing is removed. */
    if(!confirm('Cancel \u201c'+t.text+'\u201d? Nothing is deleted, and you can bring it back. '
      +(had ? name+' is told it\u2019s cancelled the next time you send.' : 'It hasn\u2019t been sent to '+name+' yet.'))) return;
  }
  const why = await listEdit(r.jobId, r.day, (rec, now)=>taskGone(rec, now, tid, flag));
  if(why && why!==NOTHING){ toast(why); return; }
  closeSheet(true); listRedraw(); toast(flag ? 'Cancelled' : 'Brought back');
}
async function moveTask(tid, dir){

  if(why && why!==NOTHING){ toast(why); return; }
  if(!why) listRedraw();

async function listsFresh(){
  /* A delete: it removes lists this phone holds and cannot read. */
  if(!confirm('Start again with no lists? The lists saved on this phone can\u2019t be read, and this removes them. Your crew and your jobs stay.')) return;
  try{ await idbClearLists(); }catch(e){ toast('I couldn\u2019t change this phone\u2019s storage. Nothing was removed.'); return; }

/* ============================================================
   Send \u2014 the guided queue, one private link per worker
   ============================================================ */
function renderSend(r){
  const job = jobs.find(j=>j.id===r.jobId);
  const head = topbar('Send', (job ? job.name+' \u00b7 ' : '')+dayLabel(r.day))+'<div class="wrap">'+secHead('Send','send');
  if(listsState!=='ready') return head+listsNotReady()+versionStamp()+'</div>';
  const stored = listFind(r.jobId, r.day);
  const rec = stored ? listLive(stored) : null, ws = rec ? sendWorkers(rec) : [];
  if(!ws.length) return head+'<div class="card prose">There\u2019s nothing to send for this day yet. Add a task first.</div>'+versionStamp()+'</div>';
  prepFor(stored);
  const fresh = _prep.key===stored.listId && _prep.rev===rev && !_prep.busy;
  let next = null, waiting = 0, blocked = 0;
  const cards = ws.map(w=>{
    const st = sendState(rec, w.id), q = rec.queue[w.id], p = q ? null : (fresh ? _prep.by[w.id] : null);
    const src = q || (p && p.ok ? p : null), tag = ' data-wid="'+esc(w.id)+'"';
    let body = '', code = '';
    if(src){
      const n = src.parts.length;
      if(n>1) body += '<div class="sub" style="margin-top:8px">'+esc('Too long for one text, so it goes as '+n+'. Send every part.')+'</div>';
      body += src.parts.map((part,i)=>{
        const label = partLabel(w.name, i, n);
        if(!part.done && !next) next = { wid:w.id, n:i, label:label };
        return '<div class="part" data-n="'+i+'" data-done="'+(part.done ? '1' : '0')+'" data-chars="'+part.link.length+'">'
          +'<button class="tick" data-action="send-tick"'+tag+' data-n="'+i+'" aria-pressed="'+(part.done ? 'true' : 'false')+'" aria-label="'+esc(label+', sent')+'">'+I.check+'</button>'
          +'<span class="grow">'+esc(n>1 ? 'Part '+(i+1)+' of '+n : 'One text')+'</span>'
          +'<button class="btn sm" data-action="send-part"'+tag+' data-n="'+i+'">'+(part.done ? 'Again' : 'Send')+'</button></div>';
      }).join('');
    } else if(p && !p.ok){
      /* Refused before anything is shared, with its own cause (rule 12). */
      blocked++; code = p.code;
      const fix = p.code==='task_too_long' ? 'Shorten this task' : p.code==='names_too_long' ? 'Shorten this name' : '';
      body = '<div class="field-msg bad refusal">'+esc(p.reason || EGSCrew.REASONS.invalid)+'</div>'
        +(fix ? '<button class="btn sm" style="margin-top:10px" data-action="send-fix"'+tag+'>'+fix+'</button>' : '');
    } else if(st.k==='sent'){
      body = '<button class="btn sm" style="margin-top:10px" data-action="send-again"'+tag+'>Send again</button>';
    } else { waiting++; body = '<div class="sub" style="margin-top:8px">Measuring\u2026</div>'; }
    const note = sendNote[w.id];
    if(note && note.rev===rev && q && q.parts[note.n] && !q.parts[note.n].done)
      body += '<div class="field-msg '+(note.outcome==='copied' ? 'warn' : 'bad')+' send-note" data-outcome="'+note.outcome+'">'+esc(note.text)+'</div>';
    return '<div class="card send-w"'+tag+' data-state="'+st.k+'"'+(code ? ' data-refused="'+esc(code)+'"' : '')+'>'
      +'<div class="grp"><span class="who">'+esc(w.name)+'</span>'+sendPill(st)+'</div>'+body+'</div>';
  }).join('');
  const sentN = ws.filter(w=>sendState(rec, w.id).k==='sent').length;
  const top = next ? '<button class="btn primary block" id="send-next" data-action="send-part" data-wid="'+esc(next.wid)+'" data-n="'+next.n+'">'+esc('Send '+next.label)+'</button>'
      +'<div class="sub" id="send-count" style="margin-top:8px">'+esc(sentN+' of '+ws.length+' sent')+'</div>'
    : waiting ? '<div class="card prose">Measuring the links\u2026</div>'
    : blocked ? '<div class="card prose">Nothing else can go until what\u2019s below is fixed.</div>'
    : '<div class="card prose" id="send-done">Everything is sent.</div>';
  return head+top+'<div style="margin-top:14px">'+cards+'</div>'+versionStamp()+'</div>';
}
function shareLine(rec, i, n){
  return rec.boss.name+': tasks for '+rec.job.name+', '+dayLabel(rec.day)+(n>1 ? ' (part '+(i+1)+' of '+n+')' : '');
}
/* Write a measured send down as this worker's queue. Resolves to the stored
   list, or null if there was nothing measured to start or it would not save. */
async function queueStart(r, wid){
  const stored = listFind(r.jobId, r.day); if(!stored) return null;
  if(stored.queue[wid]) return stored;
  const p = _prep.by[wid];
  if(!p || !p.ok || _prep.busy || _prep.rev!==rev || _prep.key!==stored.listId) return null;
  const why = await listEdit(r.jobId, r.day, rec=>{
    if(rec.queue[wid]) return NOTHING;
    rec.queue[wid] = { sendId:p.sendId, at:p.at, parts:p.parts.map(x=>({ link:x.link, ids:x.ids, done:false })) };
    return null;
  }, true);
  if(why && why!==NOTHING){ toast(why); return null; }
  delete _prep.by[wid]; delete _prep.force[wid];
  return listFind(r.jobId, r.day);
}
/* One part, out through the share sheet. The send is written down as the
   sheet opens, not after it closes: a phone that shuts the app while the
   message is being written still knows which links belong to this send.
   The sheet is asked for before anything is awaited, because a browser only
   opens it straight from a tap. */
async function sendPart(wid, n){
  const r = routeOf(view); if(r.base!=='send' || !r.jobId) return;
  const stored = listFind(r.jobId, r.day); if(!stored) return;
  const p = _prep.by[wid];
  const src = stored.queue[wid] || ((p && p.ok && !_prep.busy && _prep.rev===rev && _prep.key===stored.listId) ? p : null);
  const part = src && src.parts[n];
  if(!part) return;
  const rec = listLive(stored), w = rec.workers.find(x=>x.id===wid);
  const text = shareLine(rec, n, src.parts.length)+'\n'+part.link;
  delete sendNote[wid];
  /* Both the share sheet and the clipboard are asked for here, inside the
     tap. Neither may come after an await: a phone refuses them once the tap
     is spent. Only a share that resolves ticks the part. */
  const sharing = navigator.share ? shareStart(text) : null;
  const copying = sharing ? null : clipWrite(text);
  const written = queueStart(r, wid);
  let outcome = 'copied', why = '';
  if(sharing){
    try{ await sharing; outcome = 'shared'; }
    catch(e){ outcome = (e && e.name==='AbortError') ? 'closed' : 'refused'; why = (e && e.name) || 'Error'; }
  } else {
    try{ await copying; }catch(e){ outcome = 'nocopy'; }
  }
  if(!(await written)){ render(); return; }                  /* it could not be written down, and said so */
  if(outcome==='shared'){ await tickPart(wid, n, true); return; }
  const who = w ? w.name : 'them';
  sendNote[wid] = { rev:rev, n:n, outcome:outcome,
    text: outcome==='closed' ? 'Not sent. The share sheet was closed before anything went.'
      : outcome==='refused' ? 'Not sent. This phone wouldn’t open the share sheet ('+why+').'
      : outcome==='nocopy' ? 'Not sent. It couldn’t be copied either.'
      : 'Copied, not sent yet. Paste it into a text to '+who+', then tick it.' };
  render();
  if(outcome==='copied'){ toast('Copied. Paste it into a text to '+who+', then tick it.'); return; }
  if(outcome==='closed') return;
  /* The tap is spent, so the text is shown with a Copy button: that is a tap of its own. */
  sheet('<h2>'+esc(partLabel(w ? w.name : 'Their', n, src.parts.length))+'</h2>'
    +'<div class="muted" style="font-size:13px;margin-bottom:10px">'+esc(sendNote[wid].text)+' Copy this and send it by text, then tick it:</div>'
    +'<div class="card mono" style="font-size:12.5px;word-break:break-all;line-height:1.6">'+esc(text)+'</div>'
    +'<button class="btn primary block" data-copy="'+esc(text)+'">Copy</button>');
}
/* Each returns its promise straight away, still inside the tap. A call that
   throws instead of rejecting is turned into a rejection. */
function shareStart(text){
  try{ return Promise.resolve(navigator.share({ text:text })); }catch(e){ return Promise.reject(e); }
}
function clipWrite(text){
  try{ return Promise.resolve(navigator.clipboard.writeText(text)); }catch(e){ return Promise.reject(e); }
}
/* A tick. What that part carried is recorded as given straight away, so a
   tombstone can follow it even if the rest of the send never goes. The
   worker counts as sent, as of the moment the links were measured, only
   when every part is ticked. */
async function tickPart(wid, n, flag){
  const r = routeOf(view); if(r.base!=='send' || !r.jobId) return;
  if(!(await queueStart(r, wid))) return;
  if(flag) delete sendNote[wid];
  const why = await listEdit(r.jobId, r.day, rec=>{
    const q = rec.queue[wid], part = q && q.parts[n];
    if(!part || part.done===flag) return NOTHING;
    part.done = flag;
    if(flag){
      const was = rec.sent[wid] ? rec.sent[wid].at : 0;
      rec.sent = EGSCrew.recordSend(rec.sent, { tasks:rec.tasks.filter(t=>part.ids.indexOf(t.id)>=0) }, [wid], was);
      if(q.parts.every(p=>p.done)){ rec.sent = EGSCrew.recordSend(rec.sent, rec, [wid], q.at); delete rec.queue[wid]; }
    }
    return null;
  }, true);
  if(why && why!==NOTHING) toast(why);
  render();
}
function sendAgain(wid){
  const r = routeOf(view), stored = r.jobId ? listFind(r.jobId, r.day) : null;
  if(!stored || stored.queue[wid]) return;
  _prep.force[wid] = true; rev++; render();
}
function sendFix(wid){
  const p = _prep.by[wid]; if(!p || p.ok) return;
  if(p.code==='task_too_long' && p.taskId) openTask(p.taskId);
  else if(p.code==='names_too_long'){
    if(p.which==='boss') openEditName();
    else if(p.which==='job' || p.which==='worker') openRecord(p.which, p.id);
  }
}

/* ============================================================
   Crew and Jobs — one screen, one sheet, two kinds of record
   ============================================================ */
const UI = {
  worker:{ view:'crew', title:'Crew', help:'crew', add:'Add a worker', edit:'Edit worker', things:'crew',
           extraLabel:'Note (optional)', extraHint:'Trade, phone\u2026 (optional)', extraWord:'A note',
           empty:'Nobody yet. Add the people you send lists to.',
           none:'Nobody yet.', one:'1 person', many:n=>n+' people' },
  job:{ view:'jobs', title:'Jobs', help:'jobs', add:'Add a job', edit:'Edit job', things:'jobs',
        extraLabel:'Address (optional)', extraHint:'Address (optional)', extraWord:'An address',
        empty:'No jobs yet. Add the jobs you send lists for.',
        none:'No jobs yet.', one:'1 job', many:n=>n+' jobs' }
};
function recordsOf(kind){ return kind==='worker' ? roster : jobs; }
function setRecords(kind, list){ if(kind==='worker') roster = list; else jobs = list; }
function countLine(kind){
  const n = recordsOf(kind).filter(r=>!r.archived).length, u = UI[kind];
  return n===0 ? u.none : (n===1 ? u.one : u.many(n));
}
/* Sorted for display by name, ties broken by id. Stored order is the order
   things were added in, which is nobody's chosen order, so it is never shown. */
function byName(a, b){
  return a.name.localeCompare(b.name, undefined, { sensitivity:'base' }) || (a.id<b.id ? -1 : a.id>b.id ? 1 : 0);
}
function recordRow(kind, r){
  const extra = r[KINDS[kind].extra];
  return '<button data-action="rec-edit" data-kind="'+kind+'" data-id="'+esc(r.id)+'"><span class="grow"><span class="rec-name">'+esc(r.name)+'</span>'
    +(extra ? '<br><span class="sub rec-extra">'+esc(extra)+'</span>' : '')+'</span><span class="chev">'+I.chevronR+'</span></button>';
}
function renderRecords(kind){
  const u = UI[kind], key = K[KINDS[kind].key];
  if(unreadable.has(key)){
    /* Both copies on this phone failed the check. They are left alone, and
       nothing is drawn from them. */
    return topbar(u.title)+'<div class="wrap">'+secHead(u.title, u.help)
      +'<div class="card prose">I can\u2019t read the '+esc(u.things)+' saved on this phone, so I\u2019ve left it untouched. Restoring a backup brings it back.</div>'
      +'<button class="btn block" data-go="support">Support &amp; Backup</button>'
      +'<button class="btn danger block" style="margin-top:12px" data-action="store-fresh" data-kind="'+kind+'">Start again with none</button>'
      +versionStamp()+'</div>';
  }
  const all = recordsOf(kind).slice().sort(byName), live = all.filter(r=>!r.archived), gone = all.filter(r=>r.archived);
  return topbar(u.title)+'<div class="wrap">'+secHead(u.title, u.help)
    +'<button class="btn primary block" data-action="rec-add" data-kind="'+kind+'">'+esc(u.add)+'</button>'
    +(live.length ? '<div class="list" id="rec-list" style="margin-top:12px">'+live.map(r=>recordRow(kind, r)).join('')+'</div>'
                  : '<div class="card prose" style="margin-top:12px">'+esc(u.empty)+'</div>')
    +(gone.length ? secHead('Archived')+'<div class="list" id="rec-archived">'+gone.map(r=>recordRow(kind, r)).join('')+'</div>' : '')
    +versionStamp()+'</div>';
}
function openRecord(kind, id){
  const u = UI[kind], k = KINDS[kind];
  const r = id ? recordsOf(kind).find(x=>x.id===id) : null;
  if(id && !r) return;
  const tag = ' data-kind="'+kind+'" data-id="'+esc(r?r.id:'')+'"';
  sheet(helpMark(u.help, true)+'<h2>'+esc(r?u.edit:u.add)+'</h2>'
    +'<input class="input" id="rec-name" data-name-input data-role="'+kind+'" data-msg="rec-name-msg" data-exclude="'+esc(r?r.id:'')+'" type="text" autocapitalize="words" enterkeyhint="done" placeholder="Name" aria-label="Name" data-orig="'+esc(r?r.name:'')+'" value="'+esc(r?r.name:'')+'">'
    +'<div class="field-msg" id="rec-name-msg" aria-live="polite"></div>'
    +'<input class="input" id="rec-extra" style="margin-top:10px" type="text" enterkeyhint="done" placeholder="'+esc(u.extraHint)+'" aria-label="'+esc(u.extraLabel)+'" data-orig="'+esc(r?r[k.extra]:'')+'" value="'+esc(r?r[k.extra]:'')+'">'
    +'<div class="field-msg bad" id="rec-extra-msg" aria-live="polite"></div>'
    +'<button class="btn primary block" data-action="rec-save"'+tag+'>Save</button>'
    +(r ? (r.archived ? '<button class="btn block" data-action="rec-unarchive"'+tag+'>Bring back</button>'
                      : '<button class="btn danger block" data-action="rec-archive"'+tag+'>Archive</button>') : ''));
  if(r) onNameInput(document.getElementById('rec-name'));
}
function nowSec(){ return Math.floor(Date.now()/1000); }
/* Put a changed list down. On failure the list in memory goes back to what
   the phone still holds, and the caller says so. */
function putRecords(kind, next){
  const before = recordsOf(kind);
  setRecords(kind, next);
  if(commit(KINDS[kind].key)){ rev++; return true; }
  setRecords(kind, before);
  return false;
}
async function saveRecord(kind, id){
  const k = KINDS[kind], u = UI[kind];
  const input = document.getElementById('rec-name'), extraEl = document.getElementById('rec-extra');
  if(!input || !extraEl) return;
  const seq = ++_nameSeq;
  const r = await nameCheck(input.value, kind, id||null);
  if(seq!==_nameSeq) return;
  const el = document.getElementById('rec-name-msg'), xel = document.getElementById('rec-extra-msg');
  if(r.level==='empty'){ showNameResult(el, { level:'bad', msg:'Type a name first.' }); input.focus(); return; }
  if(r.level==='bad'){ showNameResult(el, r); input.focus(); return; }
  const extra = extraEl.value.trim();
  if(!lineOk(extra, k.extraMax)){ xel.textContent = u.extraWord+' can be up to '+k.extraMax+' characters, on one line.'; extraEl.focus(); return; }
  xel.textContent = '';
  const list = recordsOf(kind), old = id ? list.find(x=>x.id===id) : null;
  if(id && !old) return;
  if(old && old.name===r.name && old[k.extra]===extra){ closeSheet(true); return; }     /* nothing changed, nothing written */
  const t = nowSec();
  /* The id is minted here, once, and an edit copies it across untouched. */
  const rec = cleanRecord(kind, Object.assign({ id:old?old.id:EGSCrew.newId(), name:r.name, archived:old?old.archived:false,
                                               createdAt:old?old.createdAt:t, updatedAt:t }, { [k.extra]:extra }));
  if(!rec || !putRecords(kind, old ? list.map(x=>x.id===id?rec:x) : list.concat([rec]))){
    showNameResult(el, { level:'bad', msg:'I couldn\u2019t save that on this phone. Nothing was changed.' });
    return;
  }
  closeSheet(true); render(); toast(old ? 'Saved' : 'Added');
  askPersist();
}
function setArchived(kind, id, flag){
  const list = recordsOf(kind), old = list.find(x=>x.id===id);
  if(!old || old.archived===flag) return;
  /* Archive and Bring back act on the saved record, so edits typed into the
     sheet and not saved would be lost. That is asked about first. */
  if(!discardOk()) return;
  /* Archiving is this app's delete, so it asks first. Nothing is removed. */
  if(flag && !confirm('Archive '+old.name+'? Nothing is deleted. '+(kind==='worker'
      ? 'They stay on lists already sent, and you can bring them back from Archived.'
      : 'It stays on lists already sent, and you can bring it back from Archived.'))) return;
  const rec = Object.assign({}, old, { archived:flag, updatedAt:nowSec() });
  if(!putRecords(kind, list.map(x=>x.id===id?rec:x))){ toast('I couldn\u2019t save that on this phone.'); return; }
  closeSheet(true); render(); toast(flag ? 'Archived' : 'Brought back');
}
function storeFresh(kind){
  const key = K[KINDS[kind].key];
  if(!confirm('Start again with no '+UI[kind].things+'? What is saved on this phone can\u2019t be read, and it is replaced the first time you add one.')) return;
  unreadable.delete(key); startedFresh.add(key);
  render();
}

/* EGS-STD:privacy-page — self-contained, offline, the whole-truth pattern. */
function renderPrivacy(){
  const card = html => '<div class="card prose">'+html+'</div>';

/* Feather "share-2", the glyph WFD uses — same path data, stroked
   currentColor so it takes the host app's icon colour. */
const EGS_SHARE_GLYPH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>';

function appShareUrl(){
  /* the app's own directory URL, never a deep link into any state */
  return location.origin + location.pathname.replace(/[^/]*$/, '');
}
/* The ONE share handler. Every entry point calls this. It can only ever send
   the public app link: no project, photo, note, setting or vault state is
   reachable from here, and keeping that true is the point. */
async function doShareApp(){
  const url=appShareUrl();
  if(navigator.share){
    try{
      await navigator.share({ title:APP_NAME, text:SHARE_APP_LINE, url });
      return;                                     /* the OS sheet said its piece */
    }catch(err){
      if(err && err.name==='AbortError') return;  /* user backed out — say nothing */
      /* anything else: fall through to the clipboard rather than swallow it */
    }
  }
  try{
    await navigator.clipboard.writeText(SHARE_APP_LINE+' '+url);
    toast('Link copied');
  }catch(e){
    /* clipboard refused (insecure context, permissions) — show it instead of
       swallowing it, so there is always a way to get the link out */
    sheet('<h2>Share '+esc(APP_NAME)+'</h2>'
      +'<div class="muted" style="font-size:13px;margin-bottom:10px">Copy this and send it on:</div>'
      +'<div class="card mono" style="font-size:12.5px;word-break:break-all;line-height:1.6">'
      +esc(SHARE_APP_LINE+' '+url)+'</div>'
      +'<button class="btn primary block" data-copy="'+esc(SHARE_APP_LINE+' '+url)+'" style="margin-top:10px">Copy</button>');
    bindCopyButtons($mr);
  }
}

/* ============================================================

   The ID is minted ONCE, here, by the component, on the tap that saves the
   first name. Renaming never touches it. A restore replaces it with the
   file's, which is the same one if the file came from this boss. */
let _nameSeq = 0;
function nameMsgEl(input){ return document.getElementById(input.dataset.msg || 'name-msg'); }
function showNameResult(el, r){
  if(!el) return;

  el.textContent = r.msg || '';

  const seq = ++_nameSeq;
  nameCheck(input.value, input.dataset.role || 'boss', input.dataset.exclude || null)
    .then(r=>{ if(seq===_nameSeq) showNameResult(nameMsgEl(input), r); }).catch(()=>{});

async function saveName(input){
  if(!input) return;
  const seq = ++_nameSeq;
  const r = await nameCheck(input.value);
  if(seq!==_nameSeq) return;

  if(r.level==='empty'){ showNameResult(el, { level:'bad', msg:'Type your name first.' }); input.focus(); return; }
  if(r.level==='bad'){ showNameResult(el, r); input.focus(); return; }
  const before = settings;
  const first = !hasIdentity(settings);
  const boss = first ? { id:EGSCrew.newId(), name:r.name } : { id:settings.boss.id, name:r.name };
  settings = Object.assign({}, settings, { boss:boss });
  if(!saveSettings()){
    settings = before;
    showNameResult(el, { level:'bad', msg:'I couldn’t save that on this phone. Nothing was changed.' });
