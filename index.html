/* ============================================================
   EGS-STD:backup — one-tap export, and a restore that trusts nothing
   ============================================================ */
const BACKUP_VERSION = 1;
const BACKUP_MAX_BYTES = 5*1024*1024;
function todayStr(){ const d = new Date(); const p = n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
async function buildBackup(){
  const crew = await idbDump();
  /* Lists go into the file through the same judge that reads them back, and
     without any half-finished send: the links of a send belong to the phone
     that started it. A stored list that fails the check stops the export. */
  crew.lists = cleanLists(crew.lists, true);
  if(!crew.lists) throw new Error('a stored list failed its check');
  return { app:APP_ID, kind:'backup', version:BACKUP_VERSION, exportedAt:new Date().toISOString(),
           appVersion:String(window.EGS_VERSION||'dev'), settings:settings, roster:roster, jobs:jobs, crew:crew };
}
async function doExport(){
  /* A store this phone can't read would go into the file as empty. */
  if(unreadable.size || listsState==='damaged'){ toast('I can\u2019t read everything saved on this phone, so I didn\u2019t make a backup that would be missing it.'); return false; }
  let payload;
  try{ payload = await buildBackup(); }
  catch(e){ toast('I couldn’t read everything, so I didn’t make a backup that would be missing some of it.'); return false; }
  const blob = new Blob([JSON.stringify(payload, null, 1)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = APP_ID+'-backup-'+todayStr()+'.json';      /* app-named, always */
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  lsSet(DEVICE.lastBackup, payload.exportedAt);
  render(); toast('Backup saved');
  return true;
}
/* A backup file is untrusted input, the same as any payload (spec rule 1):
   size cap, strict shape, ids and names judged by the component, and the
   whole file refused on any bad field, before anything is stored or shown.
   Unknown keys are dropped by never being copied. */
function readBackup(text){
  const no = reason=>({ ok:false, reason:reason });
  if(typeof text!=='string' || text.length>BACKUP_MAX_BYTES) return no('That file is too big to be a '+APP_NAME+' backup.');
  const o = parse(text);
  if(!isObj(o) || o.app!==APP_ID || o.kind!=='backup') return no('That file isn’t a '+APP_NAME+' backup.');
  if(typeof o.version!=='number' || !Number.isInteger(o.version) || o.version<1) return no('That backup doesn’t check out, so I didn’t use any of it.');
  if(o.version>BACKUP_VERSION) return no('That backup was made by a newer version of '+APP_NAME+'. Update the app, then restore it.');
  const s = o.settings;
  if(!isObj(s) || !isObj(s.boss) || typeof s.boss.id!=='string' || typeof s.boss.name!=='string')
    return no('That backup has no name and ID in it, so I didn’t use any of it.');
  if(s.schemaVersion!==undefined && !(typeof s.schemaVersion==='number' && Number.isInteger(s.schemaVersion) && s.schemaVersion>=1))
    return no('That backup doesn’t check out, so I didn’t use any of it.');
  if(proSchemaOf(s)>PRO_SCHEMA_VERSION) return no('That backup was made by a newer version of '+APP_NAME+'. Update the app, then restore it.');
  /* A backup from before schema 4 holds long IDs. They are shortened the
     same way this phone's own were, and then everything is judged as usual.
     A file that says schema 4 gets no such help: a long ID in it is a bad ID. */
  const old = proSchemaOf(s)<4, sB = old ? liftSettings(s).boss : s.boss;
  if(!bossValid(sB.id, sB.name).ok) return no('The name or ID in that backup doesn’t check out, so I didn’t use any of it.');
  /* The crew and the jobs go through the same judge as the copies on this
     phone. One bad record, or one id twice, refuses the whole file. */
  const ros = cleanRecords('worker', old ? liftRecords(o.roster) : o.roster), jb = cleanRecords('job', old ? liftRecords(o.jobs) : o.jobs);
  if(!ros || !jb) return no('Someone on the crew or one of the jobs in that backup doesn\u2019t check out, so I didn\u2019t use any of it.');
  /* Lists go through the same judge as the ones on this phone: one bad
     list refuses the whole file. Reports have no shape in this build, so
     there is nothing to check them against, and a file that carries any is
     refused whole rather than stored unchecked. The build that adds reports
     adds their check. */
  let crew = null;
  if(o.crew!==undefined){
    if(!isObj(o.crew) || !IDB_STORES.every(n=>Array.isArray(o.crew[n]))) return no('That backup doesn\u2019t check out, so I didn\u2019t use any of it.');
    if(o.crew.reports.length)
      return no('That backup holds crew reports, which this version can\u2019t check yet, so I didn\u2019t use any of it. Update the app, then restore it.');
    const ls = cleanLists(old ? o.crew.lists.map(liftList) : o.crew.lists, true);
    if(!ls) return no('One of the lists in that backup doesn\u2019t check out, so I didn\u2019t use any of it.');
    crew = { lists:ls, reports:[] };
  }
  const when = (typeof o.exportedAt==='string' && o.exportedAt.length<=40 && Date.parse(o.exportedAt)) ? new Date(Date.parse(o.exportedAt)).toISOString() : null;
  return { ok:true, schema:proSchemaOf(s), boss:{ id:sB.id, name:sB.name }, roster:ros, jobs:jb, crew:crew, exportedAt:when };
}
async function doRestore(file){
  if(!file) return;
  if(file.size>BACKUP_MAX_BYTES){ restoreRefused('That file is too big to be a '+APP_NAME+' backup.'); return; }
  let text;
  try{ text = await file.text(); }catch(e){ restoreRefused('I couldn’t read that file.'); return; }
  const b = readBackup(text);
  if(!b.ok){ restoreRefused(b.reason); return; }
  /* Restore replaces, so it asks first whenever there is anything to replace.
     Lists count even when they have not been read yet (no name on this
     phone) or could not be (damaged): the file's lists would replace them. */
  let held = lists.length;
  if(b.crew && listsState!=='ready'){ try{ held = (await idbDump()).lists.length; }catch(e){} }
  if(hasIdentity(settings) || unreadable.size || roster.length || jobs.length || held){
    const same = hasIdentity(settings) && settings.boss.id===b.boss.id;
    const live = l=>l.filter(r=>!r.archived).length;
    if(!confirm('Restore this backup? It REPLACES what\u2019s on this phone with what\u2019s in the file: '+b.boss.name
      +', '+live(b.roster)+' on the crew, '+live(b.jobs)+' jobs'+(b.crew ? ', '+(b.crew.lists.length===1 ? '1 list' : b.crew.lists.length+' lists') : '')+'.'
      +(same?'':' The ID in the file is different from the one on this phone.'))) return;
  }
  /* A backup with no crew section leaves this phone's lists and reports as
     they are (spec rule 8). One with a section replaces them, first, so a
     failure here leaves everything else untouched. */
  let crewWas = null;
  if(b.crew){
    try{ crewWas = await idbDump(); await idbReplace(b.crew); }
    catch(e){ restoreRefused('I couldn\u2019t write to this phone\u2019s storage, so nothing was restored.'); return; }
  }
  /* Crew, jobs, then settings, which carries the stamp. If any write fails,
     the ones already made are put back from what was there. This is the one
     place the data goes before the number, and it can, because all three
     writes and any putting back run in one go with nothing awaited between
     them: no state with short IDs under an old number is ever left behind.
     An empty store that was never written stays unwritten, so a round trip
     leaves the same keys behind. */
  const was = { settings:settings, roster:roster, jobs:jobs, future:schemaFromFuture, reached:proSchemaReached,
                dirty:Array.from(proSchemaDirty), raw:{ roster:lsGet(K.roster), jobs:lsGet(K.jobs) } };
  roster = b.roster; jobs = b.jobs; settings = { boss:b.boss };
  proApplySchema(b.schema);       /* the number is read off the restored data, never carried over */
  const put = name=>((name==='roster'?roster:jobs).length===0 && was.raw[name]==null) || write[name]({ replace:true });
  if(!(put('roster') && put('jobs') && saveSettings({ replace:true }))){
    roster = was.roster; jobs = was.jobs; settings = was.settings; schemaFromFuture = was.future; proSchemaReached = was.reached;
    ['roster','jobs'].forEach(name=>{ if(was.raw[name]!=null && lsGet(K[name])!==was.raw[name]) lsSet(K[name], was.raw[name]); });
    proSchemaDirty.clear(); was.dirty.forEach(name=>proSchemaDirty.add(name));     /* what was waiting to be written is waiting again */
    if(crewWas){ try{ await idbReplace(crewWas); }catch(e){} }      /* the lists go back too */
    restoreRefused('I couldn\u2019t write to this phone\u2019s storage, so nothing was restored.'); return;
  }
  startedFresh.clear();
  if(b.crew){ lists = b.crew.lists; listsState = 'ready'; }
  rev++;
  if(b.exportedAt) lsSet(DEVICE.lastBackup, b.exportedAt);
  if(sheetIsOpen()) closeSheet();
  if(navState() && navState().unseeded){ view = NAV_ROOT; render(); window.scrollTo(0,0); }
  else go(NAV_ROOT);
  askPersist();
  toast('Backup restored');
}
function restoreRefused(reason){
  sheet('<h2>Not restored</h2><p>'+esc(reason)+'</p><p class="muted">Nothing on this phone was changed.</p>'
    +'<button class="btn block" data-action="sheet-close">OK</button>');
}

   Banners: install prompt and backup nudge. Never stacked.

/* EGS-STD:install-banner — the snooze key is app-prefixed (shared-origin rule). */
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredInstall = e; renderBanners(); });
window.addEventListener('appinstalled', ()=>{ deferredInstall = null; lsSet(DEVICE.install,'1'); renderBanners(); });
function isStandalone(){ return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone===true; }
function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent); }
function installBannerWanted(){ return !isStandalone() && !lsGet(DEVICE.install); }
/* EGS-STD:backup — the nudge. It needs real data on the phone, and then one
   of two things:

     * the backup is 21 or more days overdue. With a backup on record, that
       is 21 days since it. With none, the clock starts when the oldest
       worker or job was added: a crew made this morning is not overdue.
     * the browser has not agreed to keep this app's storage, so it may clear
       it. That is a risk today, however new the data is.

   Dismissing it snoozes it 7 days. A name is not real data: crew, jobs or
   lists are, and a list cannot exist without a worker and a job, so those
   two answer for all three without opening IndexedDB at startup. */
function hasRealData(){ return roster.length>0 || jobs.length>0; }
function dataSince(){
  let t = Infinity;
  roster.concat(jobs).forEach(r=>{ if(r.createdAt<t) t = r.createdAt; });
  return t===Infinity ? 0 : t*1000;
}
let persistedOk = null;
function backupOverdue(){
  const last = Date.parse(lsGet(DEVICE.lastBackup)||'') || 0;
  return (Date.now() - (last || dataSince())) > 21*86400000;
}
function backupNudgeWanted(){
  if(!hasRealData()) return false;
  if(Date.now() < +(lsGet(DEVICE.nudge)||0)) return false;
  return backupOverdue() || persistedOk===false;
}
/* EGS-STD:schema row 11 — ask the browser to keep this storage. Asked once
   there is something to keep, never on the first-run screen. */
function askPersist(){
  if(!(navigator.storage && navigator.storage.persist)) return;
  navigator.storage.persist().then(ok=>{ persistedOk = !!ok; renderBanners(); }).catch(()=>{});
}
function renderBanners(){
  if(gate()){ $banners.innerHTML = ''; return; }
  let h = '';
  /* Install owns the slot until it is dismissed or the app is installed: it
     is a one-time ask, and the backup nudge re-offers itself. */
  if(installBannerWanted()){
    const body = deferredInstall ? 'Put it on your home screen so it opens like an app and works offline.'
      : (isIOS() ? 'In Safari, tap Share, then Add to Home Screen.' : 'In your browser’s menu, choose Install app or Add to Home screen.');
    h = '<div class="banner"><b>Install '+esc(APP_NAME)+'</b>'+esc(body)+'<div class="acts">'
      +(deferredInstall?'<button class="btn sm primary" data-action="install">Install</button>':'')
      +'<button class="btn sm" data-action="install-dismiss">Not now</button></div></div>';
  } else if(backupNudgeWanted()){
    const never = !Date.parse(lsGet(DEVICE.lastBackup)||'');
    const head = backupOverdue() ? (never ? 'No backup yet' : 'Time for a fresh backup') : 'This browser may clear the app';
    const body = backupOverdue()
      ? 'Your crew, jobs and lists exist only on this phone. A backup file means a lost phone doesn\u2019t lose them, or your ID.'
      : 'Your browser hasn\u2019t agreed to keep this app\u2019s storage, so it can clear your crew, jobs and lists when space runs short. Installing the app, or saving a backup file, protects them.';
    h = '<div class="banner"><b>'+head+'</b>'+esc(body)
      +'<div class="acts"><button class="btn sm primary" data-action="export">Back up now</button>'
      +'<button class="btn sm" data-action="nudge-snooze">Later</button></div></div>';
  }
  $banners.innerHTML = h;
}

/* ============================================================
   Events — one delegated listener each. No inline handlers in markup.
   ============================================================ */
document.addEventListener('click', function(ev){
  const t = ev.target;
  if(!(t instanceof Element)) return;
  let el;
  if((el = t.closest('[data-back]'))){ navBack(); return; }
  if((el = t.closest('[data-go]'))){ go(el.dataset.go); return; }
  if((el = t.closest('[data-share-app]'))){ doShareApp(); return; }
  /* Help replaces whatever the sheet was showing. */
  if((el = t.closest('[data-help]'))){ if(!sheetIsOpen() || discardOk()) openHelp(el.dataset.help); return; }
  if((el = t.closest('[data-copy]'))){ copyText(el.dataset.copy); return; }
  if((el = t.closest('[data-pay-tab]'))){
    /* A tab switch patches in place: no re-render, no scroll reset. */
    supportTab = PAYMENT_TABS.some(p=>p.id===el.dataset.payTab) ? el.dataset.payTab : 'interac';
    document.querySelectorAll('[data-pay-tab]').forEach(b=>b.classList.toggle('primary', b.dataset.payTab===supportTab));
    const d = document.getElementById('pay-detail');
    if(d) d.innerHTML = paymentDetailHtml(supportTab);
    return;
  }
  el = t.closest('[data-action]'); if(!el) return;
  const act = el.dataset.action;
  if(/^rec-|^store-fresh$/.test(act) && !KINDS[el.dataset.kind]) return;
  if(act==='sheet-scrim'){ if(t===el) closeSheet(); }
  else if(act==='sheet-close'){ closeSheet(); }
  else if(act==='setup-save'){ saveName(document.getElementById('boss-name')); }
  else if(act==='name-save'){ saveName(document.getElementById('edit-name')); }
  else if(act==='edit-name'){ openEditName(); }
  else if(act==='start-fresh'){ startFresh(); }
  else if(act==='rec-add'){ openRecord(el.dataset.kind, null); }
  else if(act==='rec-edit'){ openRecord(el.dataset.kind, el.dataset.id); }
  else if(act==='rec-save'){ saveRecord(el.dataset.kind, el.dataset.id || null); }
  else if(act==='rec-archive'){ setArchived(el.dataset.kind, el.dataset.id, true); }
  else if(act==='rec-unarchive'){ setArchived(el.dataset.kind, el.dataset.id, false); }
  else if(act==='store-fresh'){ storeFresh(el.dataset.kind); }
  else if(act==='lists-fresh'){ listsFresh(); }
  else if(act==='day-open'){
    const d = document.getElementById('day-date'), day = d ? d.value : '';
    if(!dayOk(day)){ toast('Pick a day first.'); return; }
    go('day/'+el.dataset.id+'/'+day);
  }
  else if(act==='day-who' || act==='task-who'){
    /* A chip patches in place: no re-render, so the field keeps its text and the keyboard. */
    const box = el.parentNode;
    box.querySelectorAll('.chip').forEach(c=>{ const on = c===el; c.classList.toggle('on', on); c.setAttribute('aria-pressed', on ? 'true' : 'false'); });
    if(act==='day-who'){ dayWho = el.dataset.wid; if(/Tap who/.test((document.getElementById('task-new-msg')||{}).textContent||'')) taskMsg('task-new-msg', ''); }
    else { const h = document.getElementById('task-who'); if(h) h.value = el.dataset.wid; }
  }
  else if(act==='task-add'){ addTask(); }
  else if(act==='task-edit'){ openTask(el.dataset.id); }
  else if(act==='task-save'){ saveTask(el.dataset.id); }
  else if(act==='task-cancel'){ cancelTask(el.dataset.id, true); }
  else if(act==='task-restore'){ cancelTask(el.dataset.id, false); }
  else if(act==='task-up'){ moveTask(el.dataset.id, -1); }
  else if(act==='task-down'){ moveTask(el.dataset.id, 1); }
  else if(act==='send-open'){ const r = routeOf(view); if(r.jobId) go('send/'+r.jobId+'/'+r.day); }
  else if(act==='send-part'){ sendPart(el.dataset.wid, +el.dataset.n); }
  else if(act==='send-tick'){ tickPart(el.dataset.wid, +el.dataset.n, el.getAttribute('aria-pressed')!=='true'); }
  else if(act==='send-again'){ sendAgain(el.dataset.wid); }
  else if(act==='send-fix'){ sendFix(el.dataset.wid); }
  else if(act==='theme'){ setTheme(el.dataset.mode); render(); toast('Look: '+THEME_LABEL[themeMode()]); }
  else if(act==='guide'){ guideSet(!guideOn()); el.setAttribute('aria-checked', guideOn()?'true':'false'); }
  else if(act==='export'){ doExport(); }
  else if(act==='install'){
    if(deferredInstall){ const p = deferredInstall; deferredInstall = null; p.prompt(); if(p.userChoice) p.userChoice.then(()=>renderBanners()).catch(()=>{}); }
  }
  else if(act==='install-dismiss'){ lsSet(DEVICE.install,'1'); renderBanners(); }
  else if(act==='nudge-snooze'){ lsSet(DEVICE.nudge, String(Date.now()+7*86400000)); renderBanners(); }
});
document.addEventListener('input', function(ev){
  const t = ev.target;
  if(!(t instanceof Element)) return;
  if(t.matches('[data-name-input]')) onNameInput(t);
  else if(t.matches('[data-task-input]')) onTaskInput(t);
});
document.addEventListener('keydown', function(ev){
  const t = ev.target;
  if(ev.key!=='Enter' || !(t instanceof Element)) return;
  if(t.id==='task-new'){ ev.preventDefault(); addTask(); }
  else if(t.id==='task-text'){ ev.preventDefault(); const b = document.querySelector('[data-action="task-save"]'); if(b) b.click(); }
  else if(t.matches('#rec-name, #rec-extra')){ ev.preventDefault(); const b = document.querySelector('[data-action="rec-save"]'); if(b) b.click(); }
  else if(t.matches('[data-name-input]')){ ev.preventDefault(); saveName(t); }
});
document.addEventListener('change', function(ev){
  const t = ev.target;
  if(t instanceof Element && t.id==='day-date'){ if(dayOk(t.value)) pickDay = t.value; }
  else if(t instanceof Element && t.matches('[data-import]')){
    const f = t.files && t.files[0];
    t.value = '';                              /* the same file can be picked again */
    doRestore(f);
  }
});

/* ============================================================
   Boot. Reads, draws, and writes nothing.
   ============================================================ */
navBoot();
render();
if(_bootReport && !gate()) reportNotYet();
if(!gate()) askPersist();
</script>
<script>
/* EGS standard PWA wiring: registers the service worker and offers a refresh
   when a new version has been deployed. */
(function(){
  if(!('serviceWorker' in navigator)) return;
  /* A first install claims the page too, and that must not reload it out from
     under someone typing their name: only an UPDATE reloads. */
  var hadController = !!navigator.serviceWorker.controller;
  window.addEventListener('load', function(){
    var reg = null;
    navigator.serviceWorker.register('./service-worker.js').then(function(r){
      reg = r;
      reg.addEventListener('updatefound', function(){
        var nw = reg.installing; if(!nw) return;
        nw.addEventListener('statechange', function(){
          if(nw.state==='installed' && navigator.serviceWorker.controller) egsUpdateBanner();
        });
      });
    }).catch(function(){});
    var refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(!hadController){ hadController = true; return; }
      if(refreshing) return; refreshing = true; location.reload();
    });
    /* EGS-STD:sw-update-poll — the browser only re-checks service-worker.js on
       a page load, so ask on a timer and whenever the app comes back to the
       front. reg.update() is a cheap no-op when nothing changed. */
    var SW_UPDATE_POLL_MS = 20*60*1000;
    function checkForUpdate(){ if(reg && document.visibilityState==='visible') reg.update().catch(function(){}); }
    setInterval(checkForUpdate, SW_UPDATE_POLL_MS);
    document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') checkForUpdate(); });
  });
  function egsUpdateBanner(){
    if(document.getElementById('egs-update')) return;
    var b = document.createElement('div'); b.id = 'egs-update';
    b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:99999;background:#D7A94B;color:#231A07;font:600 15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:13px 16px;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.35);display:flex;align-items:center;gap:12px';
    var s = document.createElement('span'); s.style.flex = '1'; s.textContent = 'A new version is ready.';
    var btn = document.createElement('button'); btn.textContent = 'Refresh';
    btn.style.cssText = 'background:#15181D;color:#fff;border:0;border-radius:8px;padding:9px 15px;font:inherit;cursor:pointer';
    btn.addEventListener('click', function(){ location.reload(); });
    b.appendChild(s); b.appendChild(btn); document.body.appendChild(b);
  }
})();
</script>
