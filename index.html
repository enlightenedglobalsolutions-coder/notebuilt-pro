<!-- EGS-STD:themes — this script runs BEFORE the stylesheet so the first paint
     is already the right theme. It only reads; nothing at startup writes.
     'system' is stamped as itself and the CSS media query follows the phone. -->
<script>window.NP_THEME_BAR={dark:'#15181D',light:'#F6F3EC'};
(function(){var m='system';
  try{var s=localStorage.getItem('notebuiltpro.theme');if(s==='light'||s==='dark')m=s;}catch(e){}
  document.documentElement.setAttribute('data-theme',m);
  var dark=(m==='dark')||(m==='system'&&!(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches));
  var t=document.querySelector('meta[name="theme-color"]');
  if(t)t.setAttribute('content',dark?window.NP_THEME_BAR.dark:window.NP_THEME_BAR.light);})();</script>
<style>
  /* ---- Design tokens: Notebuilt's trade dark-and-gold family ----
     EGS-STD:themes — the values are Notebuilt's, measured there
     (audit_contrast.py), and used here in the same pairings.

     THE ROLE RULE: --ink is always the GROUND and --paper is always the TEXT
     ON IT. The names are roles, not brightnesses; the values swap ends of the
     scale between themes. --brass is the accent you READ, --brass-fill is the
     gold PLATE, and --on-brass is the only ink that goes on that plate. */
  :root{
    --ink:#15181D; --ink-2:#1C2027; --ink-3:#252A33;
    --line:#333A45; --line-soft:#2A2F39; --line-strong:#67758B;
    --paper:#ECE6D8; --paper-dim:#A7A294; --paper-faint:#949186; --placeholder:#7C7A74;
    --brass:#D7A94B; --brass-fill:#D7A94B; --on-brass:#231A07;
    --done:#7E9D63; --danger:#D07A64;
    --nav-bg:rgba(20,24,29,.92);
    --scrim:rgba(0,0,0,.55);
    --shadow-pop:0 8px 22px rgba(0,0,0,.45);
    --radius:14px; --radius-sm:10px; --tap:46px;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
    --safe-l:env(safe-area-inset-left,0px);
    --safe-r:env(safe-area-inset-right,0px);
    --serif:ui-serif,Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  /* ORDER MATTERS. The media block is guarded so an explicit choice of night
     wins over a daylight phone, and the [data-theme="light"] block comes after
     it because the two have the same specificity. The light ground is the
     fleet-wide #F6F3EC (EGS-STANDARDS.md §3). */
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --ink:#F6F3EC; --ink-2:#FBF9F3; --ink-3:#FFFFFF;
      --line:#998F78; --line-soft:#C9C0AC; --line-strong:#8B8069;
      --paper:#1E222A; --paper-dim:#55595F; --paper-faint:#68655C; --placeholder:#87847C;
      --brass:#855E11; --brass-fill:#D7A94B; --on-brass:#231A07;
      --done:#4A6B33; --danger:#A83E27;
      --nav-bg:rgba(251,249,243,.92);
      --scrim:rgba(38,32,20,.44);
      --shadow-pop:0 8px 22px rgba(58,48,30,.20);
    }
  }
  :root[data-theme="light"]{
    --ink:#F6F3EC; --ink-2:#FBF9F3; --ink-3:#FFFFFF;
    --line:#998F78; --line-soft:#C9C0AC; --line-strong:#8B8069;
    --paper:#1E222A; --paper-dim:#55595F; --paper-faint:#68655C; --placeholder:#87847C;
    --brass:#855E11; --brass-fill:#D7A94B; --on-brass:#231A07;
    --done:#4A6B33; --danger:#A83E27;
    --nav-bg:rgba(251,249,243,.92);
    --scrim:rgba(38,32,20,.44);
    --shadow-pop:0 8px 22px rgba(58,48,30,.20);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--sans);font-size:15px;line-height:1.45;background:var(--ink);color:var(--paper);
    min-height:100vh;min-height:100dvh;overscroll-behavior-y:contain;-webkit-tap-highlight-color:transparent;
    overflow-wrap:anywhere}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input{font:inherit;color:var(--paper)}
  a{color:var(--brass)}
  b{font-weight:600}
  .hidden{display:none!important}
  .muted{color:var(--paper-dim)}
  .mono{font-family:var(--mono)}
  .grow{flex:1;min-width:0}
  .row{display:flex;align-items:center;gap:12px}

  /* ---- Top bar ---- */
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
    padding:calc(8px + var(--safe-t)) calc(10px + var(--safe-r)) 8px calc(12px + var(--safe-l));
    background:var(--nav-bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line-soft)}
  .topbar h1{font-family:var(--serif);font-size:21px;font-weight:600;line-height:25px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .eyebrow{display:block;font-family:var(--mono);font-size:10px;line-height:14px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--paper-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .icon-btn{flex:none;width:var(--tap);height:var(--tap);display:inline-flex;align-items:center;
    justify-content:center;border-radius:12px;color:var(--paper-dim)}
  .icon-btn:active{background:var(--ink-3)}
  .icon-btn svg{width:22px;height:22px}
  .ico{flex:none;display:inline-flex;width:18px;height:18px}
  .ico svg{width:18px;height:18px}
  .chev{flex:none;display:inline-flex;width:16px;height:16px;color:var(--paper-faint)}
  .chev svg{width:16px;height:16px}

  /* The mark. One const (PRO_MARK) draws it everywhere; these classes are the
     only thing that sizes it, so an unsized copy cannot exist. */
  .mark{flex:none;display:inline-block}
  .mark svg{display:block;width:100%;height:100%}
  .mark-sm{width:34px;height:34px}
  .mark-lg{width:88px;height:88px}

  .wrap{max-width:640px;margin:0 auto;
    padding:0 calc(16px + var(--safe-r)) calc(110px + var(--safe-b)) calc(16px + var(--safe-l))}

  /* EGS-STD:coldopen-version — one look for the stamp, wherever it is drawn. */
  .ver-stamp{font-family:var(--mono);text-align:center;font-size:10.5px;letter-spacing:.12em;
    color:var(--paper-faint);margin:20px 0 4px}

  /* ---- Cards, rows ---- */
  .card{background:var(--ink-3);border:1px solid var(--line-soft);border-radius:var(--radius);
    padding:14px;margin-bottom:12px}
  .card.prose{font-size:13.5px;line-height:1.6;color:var(--paper-dim)}
  .card.prose b{color:var(--paper)}
  .card.tap{cursor:pointer}
  .card.tap:active{border-color:var(--line)}
  .sub{font-size:13px;color:var(--paper-dim)}
  .list{background:var(--ink-3);border:1px solid var(--line-soft);border-radius:var(--radius);
    margin-bottom:12px;overflow:hidden}
  .list > *{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:10px 14px;
    text-align:left;text-decoration:none;color:var(--paper);border-bottom:1px solid var(--line-soft)}
  .list > *:last-child{border-bottom:0}
  .list > button:active,.list > a:active{background:var(--ink-2)}

  /* ---- Section heading with a blueprint rule ---- */
  .sec-head{display:flex;align-items:baseline;gap:10px;margin:18px 0 10px}
  .sec-head .label{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--paper-dim);white-space:nowrap}
  .sec-head .rule{flex:1;height:1px;background:var(--line)}

  /* ---- Info markers ----
     EGS-STD:infomode — the stylesheet half.

     ONE RULE switches every marker off: the [data-guide="off"] line at the
     bottom of this block. No render function ever asks which mode the app is
     in; they all draw the marker and the stylesheet decides whether it shows.

     ZERO REFLOW BETWEEN MODES, so there are exactly two hosts:
       * inside a .sec-head, straight after .label — .rule is flex:1 and
         swallows the marker's width, and 15px is under the label's line box;
       * .help-corner, absolute in a sheet's top-right, out of flow.
     A variable-length string never hosts a marker. test_pro.js diffs every
     element's box between the two modes across a width sweep. */
  .help-i{flex:none;align-self:center;position:relative;width:15px;height:15px;padding:0;border-radius:50%;
    border:1px solid var(--line-strong);background:none;color:var(--paper-dim);font-family:var(--serif);
    font-size:10px;font-style:italic;line-height:1;display:inline-flex;align-items:center;
    justify-content:center;vertical-align:-2px}
  .help-i:active{border-color:var(--brass);color:var(--brass)}
  .help-i::after{content:'';position:absolute;top:-11px;bottom:-11px;left:-6px;right:-14px}
  .sec-head .help-i{margin-left:-2px}
  .help-corner{position:absolute;top:9px;right:12px;z-index:1}
  .help-corner::after{left:-11px;right:-11px}
  /* THE ONE RULE. Expert mode is this line and nothing else. */
  :root[data-guide="off"] .help-i{display:none}

  /* ---- Buttons ---- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);
    padding:10px 16px;border-radius:var(--radius-sm);border:1px solid var(--line-strong);
    color:var(--paper);font-weight:600;text-align:center;text-decoration:none}
  .btn:active{background:var(--ink-2)}
  .btn.primary{background:var(--brass-fill);border-color:var(--brass-fill);color:var(--on-brass)}
  .btn.primary:active{filter:brightness(.93)}
  .btn.danger{border-color:var(--danger);color:var(--danger)}
  .btn.block{display:flex;width:100%}
  .btn.sm{min-height:38px;padding:7px 12px;font-size:13.5px}
  .btn[disabled]{opacity:.55}

  /* ---- Fields ---- */
  .input{display:block;width:100%;min-height:var(--tap);padding:11px 12px;border-radius:var(--radius-sm);
    border:1px solid var(--line-strong);background:var(--ink-2);color:var(--paper);font-size:16px}
  .input::placeholder{color:var(--placeholder);opacity:1}
  .input:focus{outline:2px solid var(--brass);outline-offset:1px}
  .field-msg{font-size:13px;line-height:1.5;margin:8px 0 0}
  .field-msg:empty{display:none}
  .field-msg.warn{color:var(--brass)}
  .field-msg.bad{color:var(--danger)}

  /* ---- Day and Send ---- */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
  .chip{max-width:100%;min-height:40px;padding:7px 14px;border-radius:999px;border:1px solid var(--line-strong);
    color:var(--paper);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip.on{background:var(--brass-fill);border-color:var(--brass-fill);color:var(--on-brass);font-weight:600}
  .grp{display:flex;align-items:center;gap:8px;margin:18px 0 8px}
  .grp .who{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{flex:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
    padding:3px 8px;border-radius:999px;border:1px solid var(--line-strong);color:var(--paper-dim);white-space:nowrap}
  .pill[data-state="sent"]{border-color:var(--done);color:var(--done)}
  .pill[data-state="changed"],.pill[data-state="part"]{border-color:var(--brass);color:var(--brass)}
  .list > .task{gap:2px;padding:4px 4px 4px 14px}
  .task .task-text{flex:1;min-width:0;min-height:46px;padding:8px 8px 8px 0;text-align:left}
  .task .mv{flex:none;width:40px;height:46px;display:inline-flex;align-items:center;justify-content:center;
    border-radius:10px;color:var(--paper-dim)}
  .task .mv:active{background:var(--ink-2)}
  .task .mv[disabled]{opacity:.3}
  .task .mv svg{width:18px;height:18px}
  .gone-text{text-decoration:line-through;color:var(--paper-dim)}
  .send-w .grp{margin:0}
  .part{display:flex;align-items:center;gap:10px;margin-top:10px}
  .tick{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--line-strong);display:inline-flex;
    align-items:center;justify-content:center;color:transparent}
  .tick svg{width:20px;height:20px}
  .tick[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:var(--ink)}

  /* ---- Segmented control and switch: fixed boxes, nothing reflows ---- */
  .seg{display:flex;border:1px solid var(--line-strong);border-radius:var(--radius-sm);overflow:hidden}
  .seg button{flex:1;min-height:var(--tap);padding:8px 4px;color:var(--paper-dim);font-weight:600;font-size:14px}
  .seg button + button{border-left:1px solid var(--line-strong)}
  .seg button.on{background:var(--brass-fill);color:var(--on-brass)}
  .switch{flex:none;position:relative;width:50px;height:30px;border-radius:15px;
    border:1px solid var(--line-strong);background:var(--ink-2)}
  .switch::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
    background:var(--line-strong)}
  .switch[aria-checked="true"]{background:var(--brass-fill);border-color:var(--brass-fill)}
  .switch[aria-checked="true"]::after{left:23px;background:var(--on-brass)}

  /* ---- First run, and the two gates that share its frame ---- */
  .setup{max-width:480px;margin:0 auto;
    padding:calc(26px + var(--safe-t)) calc(20px + var(--safe-r)) calc(20px + var(--safe-b)) calc(20px + var(--safe-l))}
  .setup .mark{display:block;margin:0 auto 12px}
  .setup h1{font-family:var(--serif);font-size:25px;font-weight:600;text-align:center}
  .setup .lede{text-align:center;color:var(--paper-dim);font-size:14px;margin:6px 0 4px}
  .setup .fine{font-size:12.5px;color:var(--paper-dim);margin:10px 0 0}
  .setup .btn.block{margin-top:12px}

  /* ---- Sheet ---- */
  #sheet-root .scrim{position:fixed;inset:0;z-index:80;background:var(--scrim);display:flex;
    align-items:flex-end;justify-content:center}
  .sheet{position:relative;width:100%;max-width:640px;max-height:88vh;max-height:88dvh;overflow:auto;
    background:var(--ink-2);border:1px solid var(--line-soft);border-bottom:0;border-radius:18px 18px 0 0;
    padding:18px calc(16px + var(--safe-r)) calc(18px + var(--safe-b)) calc(16px + var(--safe-l))}
  .sheet h2{font-family:var(--serif);font-size:19px;font-weight:600;margin:0 34px 12px 0}
  .sheet p{font-size:14.5px;line-height:1.55;margin-bottom:12px}
  .sheet .btn.block{margin-top:12px}

  /* ---- Banners (install, backup): one at a time, above the gesture bar ---- */
  #banners{position:fixed;left:calc(12px + var(--safe-l));right:calc(12px + var(--safe-r));
    bottom:calc(12px + var(--safe-b));z-index:40}
  .banner{max-width:616px;margin:0 auto;background:var(--ink-2);border:1px solid var(--line-strong);
    border-radius:var(--radius);padding:12px;box-shadow:var(--shadow-pop);font-size:13.5px;line-height:1.5}
  .banner b{display:block;margin-bottom:2px}
  .banner .acts{display:flex;gap:8px;margin-top:10px}
  .banner .acts .btn{flex:1}

  /* ---- Toast ---- */
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--safe-b));z-index:120;
    max-width:calc(100% - 32px);background:var(--paper);color:var(--ink);padding:10px 16px;border-radius:999px;
    font-size:13.5px;font-weight:600;box-shadow:var(--shadow-pop);opacity:0;pointer-events:none;
    transition:opacity .18s}
  #toast.show{opacity:1}
</style>
</head>

<script>
/* EGS-SHARED:crew-task BEGIN */
// ============================================================================
//  EGS platform — crew-task format (shared component)
//  Copyright (c) 2026 Enlightened Global Solutions. All rights reserved.
//
//  ONE source for everything a crew list or report IS: ids, the logical
//  shapes, the compact wire encoding, the codec, the validator and the merge.
//  Notebuilt (worker side) and Notebuilt Pro (boss side) each carry a
//  BYTE-IDENTICAL copy of this block, between the BEGIN/END marker lines,
//  inside their index.html. Edit it here, never in an app — PaidUp's
//  independently rewritten sw_logic is what a drifted copy turns into.
//  Spec: docs/specs/notebuilt-pro-phase1-spec.md §4–§6.
//
//  Logical shapes (what the apps store and render):
//    LIST   { f, v, k:'list', listId, issuedAt, sendId, part, parts,
//             boss:{id,name}, job:{id,name},
//             day:'YYYY-MM-DD', mode:'private'|'crew', workers:[{id,name}],
//             tasks:[{id, worker:<worker id>, text, order, editedAt,
//                     gone:null|'cancelled'|'reassigned'}] }
//    REPORT { f, v, k:'report', listId, workerId, sentAt, sendId, part, parts,
//             tasks:[{id, status:'open'|'done'|'waiting', note, changedAt}] }
//  Parts: a payload too long for one link goes out as several, each holding
//  some of the tasks. Every payload carries the 8-char sendId of its send, its
//  part number and the part count (1 of 1 when unsplit). A part of a
//  multi-worker list carries only the workers it needs; the merge puts the
//  roster back together, and keeps a stored list's workers in id order so the
//  result never depends on which part arrived first. What a device KEEPS
//  drops those three for a `send` record — { id, parts, have:[n…] } — on the
//  stored list and on each worker's received entry: the send it is following
//  and which parts are in. partsStatus() reads it (spec §6 rule 11).
//  A task's `worker` is the worker's ID in logical form; only the wire refers
//  to workers by index, because indices are per-payload and mean nothing once
//  two payloads are merged.
//
//  Wire (positional arrays, then UTF-8 → deflate-raw → base64url, with the
//  codec character '1' in front so a future codec can be told apart):
//    LIST   [3,'l',listId,issuedAt,[bossId,bossName],[jobId,jobName],day,
//            mode(0 private|1 crew),[[workerId,name]...],
//            [[taskId,workerIdx,text,order,editedAt,gone(0|1 cancelled|2 reassigned)]...],
//            [sendId,part,parts]]
//    REPORT [3,'r',listId,workerId,sentAt,[[taskId,status(0 open|1 done|2 waiting),note,changedAt]...],
//            [sendId,part,parts]]
//
//  Everything that decodes a payload returns {ok:true,value} or
//  {ok:false,code,reason} and never throws. Every merge is PURE: inputs are
//  never mutated, so a refusal leaves the caller's state byte-identical.
// ============================================================================
(function(global){
  'use strict';

  // Version 3 (Oct 2026): permanent ids went from 128 bits to 64. The layout
  // is version 2's; only the id length moved.
  // Version 2 added the trailing [sendId,part,parts]; version 1 was the layout
  // before that. Neither was used outside testing, and a payload of either is
  // refused as 'older', by its version, before anything in it is looked at.
  var FORMAT = 'egs-crew', VERSION = 3, CODEC = '1';

  // §4 starting limits. Text lengths count characters (code points), not bytes.
  var LIMITS = { name:40, text:200, note:280, tasks:300, workers:30,
                 bytes:262144,      // decompressed JSON — the zip-bomb ceiling
                 encoded:360000 };  // payload string — refused before any decoding

  // The longest link that goes out in one text message (spec §5). Measured
  // Oct 10 by SMS/RCS on Android: 800 arrived tappable, 1200 arrived as plain
  // text. Deliberately conservative — one phone, one carrier.
  var SAFE_LINK_CHARS = 700;

  var LINK = {
    list:   'https://notebuilt.ca/#crew=',
    report: 'https://pro.notebuilt.ca/#report='   // URL pending (spec §13)
  };

  // Permanent ids (list, boss, job, worker): 64 random bits as base64url = 11
  // chars. The last char carries only 4 bits, so it is one of 16 — every
  // fourth letter of the alphabet. Holding ids to that canonical form means
  // one id has exactly one spelling.
  // 64 bits is the PERMANENT length: ids are minted once and never change, so
  // this cannot move after the first real list goes out. Random bytes are the
  // one thing in a link that never compresses, and a slice carries four ids.
  // This is the only id shape accepted. There is no second length.
  var ID_RE = /^[A-Za-z0-9_-]{10}[AEIMQUYcgkosw048]$/;
  // Send ids: 48 random bits as base64url = 8 chars. One per send; every part
  // of that send carries it.
  var SEND_RE = /^[A-Za-z0-9_-]{8}$/;
  // Task ids: list-scoped base36 counters, no leading zero, ≤4 chars.
  var TASK_ID_RE = /^[1-9a-z][0-9a-z]{0,3}$/;
  var PAYLOAD_RE = /^1[A-Za-z0-9_-]+$/;
  var DAY_RE = /^(\d{4})-(\d{2})-(\d{2})$/;
  // Timestamps are epoch seconds from the writer's clock. 0 only where a
  // field may never have been touched (an untouched task's changedAt).
  var T_MIN = 1500000000, T_MAX = 4102444800;

  var STATUS = ['open', 'done', 'waiting'];
  var GONE = [null, 'cancelled', 'reassigned'];
  var MODE = ['private', 'crew'];

  // Control characters, lone surrogates, and bidi overrides/isolates (which
  // can make a name render as someone else's). Newline is allowed in notes only.
  var BAD_LINE = /[\u0000-\u001f\u007f‪-‮⁦-⁩]|[\ud800-\udbff](?![\udc00-\udfff])|(?:^|[^\ud800-\udbff])[\udc00-\udfff]/;
  // Markup in text is refused outright, on top of esc() at render: a payload
  // carrying a tag is not a crew list anyone typed. A bare '<' ("cut < 8ft") is fine.
  var TAG = /<[A-Za-z\/!?]/;
  var BAD_NOTE = /[\u0000-\u0009\u000b-\u001f\u007f‪-‮⁦-⁩]|[\ud800-\udbff](?![\udc00-\udfff])|(?:^|[^\ud800-\udbff])[\udc00-\udfff]/;

  // Plain-English reasons, shown to people as-is.
  var REASONS = {
    damaged:        'This link is damaged or incomplete. Ask for it to be sent again.',
    too_big:        'This is bigger than a crew list or report can be, so I didn’t open it.',
    newer:          'This was made by a newer version of the app. Update the app, then try again.',
    older:          'This link was made by an older version of the app and can’t be opened any more. Ask for it to be sent again.',
    wrong_kind:     'This isn’t the kind of crew link this app opens.',
    invalid:        'Something in this doesn’t check out, so I didn’t import any of it.',
    list_mismatch:  'This update doesn’t match the list you already have, so I left your list alone.',
    unknown_list:   'I don’t have the list this report is for. If you’ve reset or moved phones, restoring a backup should bring it back.',
    unknown_worker: 'This report is from someone who isn’t on that list.',
    unknown_task:   'This report mentions a task that isn’t on that list, so I didn’t use any of it.',
    not_theirs:     'This report touches a task that was never this person’s, so I didn’t use any of it.',
    // Send-time refusals (rule 12). split() gives a more specific sentence
    // where it can name the task or the name.
    task_too_long:  'One task is too long to send in a link. Shorten it, then send again.',
    names_too_long: 'The names leave no room for tasks in a link. Shorten a name, then send again.',
    cannot_fit:     'This is too big to send as links, however it is split.'
  };

  // info: extra fields a refusal carries for the caller (e.g. taskId), and
  // optionally a more specific `reason` than the stock one.
  function CrewError(code, detail, info){ this.code = code; this.detail = detail || ''; this.info = info || null; }
  function fail(code, detail, info){ throw new CrewError(code, detail, info); }
  function need(cond, detail){ if(!cond) fail('invalid', detail); }
  function refusal(e){
    if(e instanceof CrewError){
      var r = { ok:false, code:e.code, reason:REASONS[e.code], detail:e.detail };
      if(e.info) Object.keys(e.info).forEach(function(k){ r[k] = e.info[k]; });
      return r;
    }
    return { ok:false, code:'damaged', reason:REASONS.damaged, detail:String(e && e.message || e) };
  }
  function clone(x){ return JSON.parse(JSON.stringify(x)); }
  function has(o, k){ return Object.prototype.hasOwnProperty.call(o, k); }

  // ---- ids ------------------------------------------------------------------

  var B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';

  function b64e(bytes){
    var out = '', i = 0, n = bytes.length;
    for(; i + 2 < n; i += 3){
      var v = (bytes[i] << 16) | (bytes[i+1] << 8) | bytes[i+2];
      out += B64[v >> 18] + B64[(v >> 12) & 63] + B64[(v >> 6) & 63] + B64[v & 63];
    }
    if(n - i === 1){ var a = bytes[i] << 16; out += B64[a >> 18] + B64[(a >> 12) & 63]; }
    else if(n - i === 2){ var b = (bytes[i] << 16) | (bytes[i+1] << 8); out += B64[b >> 18] + B64[(b >> 12) & 63] + B64[(b >> 6) & 63]; }
    return out;
  }

  // Strict: unknown characters, an impossible length, or stray trailing bits
  // all refuse, so every byte string has exactly one accepted spelling.
  function b64d(s){
    if(s.length % 4 === 1) fail('damaged', 'base64 length');
    var map = {}, i;
    for(i = 0; i < 64; i++) map[B64[i]] = i;
    var out = new Uint8Array(Math.floor(s.length * 3 / 4)), o = 0, buf = 0, bits = 0;
    for(i = 0; i < s.length; i++){
      var c = map[s[i]];
      if(c === undefined) fail('damaged', 'base64 char');
      buf = (buf << 6) | c; bits += 6;
      if(bits >= 8){ bits -= 8; out[o++] = (buf >> bits) & 255; }
    }
    if(buf & ((1 << bits) - 1)) fail('damaged', 'base64 trailing bits');
    return out;
  }

  function newId(){
    var b = new Uint8Array(8);
    global.crypto.getRandomValues(b);
    return b64e(b);
  }

  function newSendId(){
    var b = new Uint8Array(6);
    global.crypto.getRandomValues(b);
    return b64e(b);
  }

  // Next unused task id in this list. Tombstones keep their ids, so an id is
  // never reused within a list.
  function nextTaskId(list){
    var max = 0;
    (list && list.tasks || []).forEach(function(t){ var n = parseInt(t.id, 36); if(n > max) max = n; });
    return (max + 1).toString(36);
  }

  // A writer's next timestamp for a field it already wrote: never equal to or
  // behind the last one, because a tie keeps what's there and the edit would
  // silently not travel. Guards a phone clock that stepped backwards.
  function stamp(prev, now){
    var t = Math.floor(now);
    return (typeof prev === 'number' && prev >= t) ? prev + 1 : t;
  }

  // ---- field checks -----------------------------------------------------------

  function chars(s){ return Array.from(s).length; }

  function str(s, max, what, opts){
    opts = opts || {};
    need(typeof s === 'string', what + ' not a string');
    need((opts.multiline ? BAD_NOTE : BAD_LINE).test(s) === false, what + ' has forbidden characters');
    need(TAG.test(s) === false, what + ' has markup');
    need(chars(s) <= max, what + ' too long');
    if(!opts.optional) need(s.trim().length > 0, what + ' empty');
    return s;
  }
  function time(t, what, allowZero){
    need(typeof t === 'number' && Number.isInteger(t) && ((allowZero && t === 0) || (t >= T_MIN && t <= T_MAX)), what + ' bad time');
    return t;
  }
  function id(s, what){ need(typeof s === 'string' && ID_RE.test(s), what + ' bad id'); return s; }
  function taskId(s){ need(typeof s === 'string' && TASK_ID_RE.test(s), 'bad task id'); return s; }
  function day(s){
    var m = typeof s === 'string' && DAY_RE.exec(s);
    need(m, 'bad day');
    var y = +m[1], mo = +m[2], d = +m[3], dt = new Date(Date.UTC(y, mo - 1, d));
    need(y >= 2020 && dt.getUTCFullYear() === y && dt.getUTCMonth() === mo - 1 && dt.getUTCDate() === d, 'impossible day');
    return s;
  }
  function int(n, lo, hi, what){ need(typeof n === 'number' && Number.isInteger(n) && n >= lo && n <= hi, what + ' out of range'); return n; }
  function arr(a, len, what){ need(Array.isArray(a) && (len == null || a.length === len), what + ' bad shape'); return a; }
  function unique(list, what){
    var seen = {};
    list.forEach(function(x){ need(!has(seen, x), 'duplicate ' + what); seen[x] = 1; });
  }
  // [sendId, part, parts] — which send a payload belongs to and where it sits
  // in it. Every part past the first holds at least one task or one worker
  // that has no tasks, so there are never more parts than both limits together.
  function sendFromWire(a){
    arr(a, 3, 'send');
    need(typeof a[0] === 'string' && SEND_RE.test(a[0]), 'bad send id');
    var parts = int(a[2], 1, LIMITS.tasks + LIMITS.workers, 'part count');
    return { sendId:a[0], part:int(a[1], 1, parts, 'part number'), parts:parts };
  }

  // ---- wire ⇄ logical. fromWire IS the validator: it builds a fresh object
  //      from known positions only, so nothing unrecognised can ride through. --

  function listFromWire(a){
    arr(a, 11, 'list');
    var snd = sendFromWire(a[10]);
    var boss = arr(a[4], 2, 'boss'), job = arr(a[5], 2, 'job');
    var ws = arr(a[8], null, 'workers'), ts = arr(a[9], null, 'tasks');
    var mode = MODE[int(a[7], 0, 1, 'mode')];
    need(ws.length >= 1 && ws.length <= LIMITS.workers, 'worker count');
    need(mode !== 'private' || ws.length === 1, 'private list must hold one worker');
    need(ts.length <= LIMITS.tasks, 'task count');
    var workers = ws.map(function(w){
      arr(w, 2, 'worker');
      return { id:id(w[0], 'worker'), name:str(w[1], LIMITS.name, 'worker name') };
    });
    unique(workers.map(function(w){ return w.id; }), 'worker id');
    var tasks = ts.map(function(t){
      arr(t, 6, 'task');
      return {
        id: taskId(t[0]),
        worker: workers[int(t[1], 0, workers.length - 1, 'worker index')].id,
        text: str(t[2], LIMITS.text, 'task text'),
        order: int(t[3], 0, 1000000, 'order'),
        editedAt: time(t[4], 'editedAt'),
        gone: GONE[int(t[5], 0, 2, 'gone')]
      };
    });
    unique(tasks.map(function(t){ return t.id; }), 'task id');
    return {
      f:FORMAT, v:VERSION, k:'list',
      listId: id(a[2], 'list'), issuedAt: time(a[3], 'issuedAt'),
      sendId: snd.sendId, part: snd.part, parts: snd.parts,
      boss: { id:id(boss[0], 'boss'), name:str(boss[1], LIMITS.name, 'boss name') },
      job:  { id:id(job[0], 'job'),   name:str(job[1], LIMITS.name, 'job name') },
      day: day(a[6]), mode: mode, workers: workers, tasks: tasks
    };
  }

  function reportFromWire(a){
    arr(a, 7, 'report');
    var snd = sendFromWire(a[6]);
    var ts = arr(a[5], null, 'tasks');
    need(ts.length <= LIMITS.tasks, 'task count');
    var tasks = ts.map(function(t){
      arr(t, 4, 'task');
      return { id:taskId(t[0]), status:STATUS[int(t[1], 0, 2, 'status')],
               note:str(t[2], LIMITS.note, 'note', { multiline:true, optional:true }),
               changedAt:time(t[3], 'changedAt', true) };
    });
    unique(tasks.map(function(t){ return t.id; }), 'task id');
    return { f:FORMAT, v:VERSION, k:'report',
             listId:id(a[2], 'list'), workerId:id(a[3], 'worker'), sentAt:time(a[4], 'sentAt'),
             sendId:snd.sendId, part:snd.part, parts:snd.parts, tasks:tasks };
  }

  function fromWire(a, kind){
    need(Array.isArray(a) && a.length >= 2, 'not a crew payload');
    if(typeof a[0] === 'number' && a[0] > VERSION) fail('newer');
    if(Number.isInteger(a[0]) && a[0] >= 1 && a[0] < VERSION) fail('older', 'version ' + a[0]);
    need(a[0] === VERSION, 'version');
    var k = a[1] === 'l' ? 'list' : a[1] === 'r' ? 'report' : null;
    need(k, 'kind');
    if(kind && k !== kind) fail('wrong_kind');
    return k === 'list' ? listFromWire(a) : reportFromWire(a);
  }

  function toWire(x){
    if(x && x.k === 'list'){
      var idx = {};
      x.workers.forEach(function(w, i){ idx[w.id] = i; });
      return [VERSION, 'l', x.listId, x.issuedAt, [x.boss.id, x.boss.name], [x.job.id, x.job.name], x.day,
              MODE.indexOf(x.mode),
              x.workers.map(function(w){ return [w.id, w.name]; }),
              x.tasks.map(function(t){
                need(has(idx, t.worker), 'task assigned to a worker not on the list');
                return [t.id, idx[t.worker], t.text, t.order, t.editedAt, GONE.indexOf(t.gone)];
              }),
              [x.sendId, x.part, x.parts]];
    }
    if(x && x.k === 'report'){
      return [VERSION, 'r', x.listId, x.workerId, x.sentAt,
              x.tasks.map(function(t){ return [t.id, STATUS.indexOf(t.status), t.note, t.changedAt]; }),
              [x.sendId, x.part, x.parts]];
    }
    fail('invalid', 'unknown kind');
  }

  // Validate a logical object (e.g. one an app built) by putting it through
  // the exact path a received payload takes.
  function validate(x, kind){
    try { return { ok:true, value:fromWire(JSON.parse(JSON.stringify(toWire(x))), kind) }; }
    catch(e){ return refusal(e); }
  }

  // ---- codec ------------------------------------------------------------------

  function concat(chunks, n){
    var out = new Uint8Array(n), o = 0;
    chunks.forEach(function(c){ out.set(c, o); o += c.byteLength; });
    return out;
  }

  async function readAll(stream, cap){
    var rd = stream.getReader(), chunks = [], n = 0;
    for(;;){
      var r = await rd.read();
      if(r.done) break;
      n += r.value.byteLength;
      if(cap != null && n > cap){ try { await rd.cancel(); } catch(e){} fail('too_big', 'decompressed past cap'); }
      chunks.push(r.value);
    }
    return concat(chunks, n);
  }

  function deflate(bytes){
    return readAll(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw')));
  }
  // Streams and counts as it goes, so a bomb is cut off at the cap instead of
  // being inflated whole and measured afterwards.
  function inflate(bytes, cap){
    return readAll(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw')), cap);
  }

  async function encode(x){
    try {
      var v = validate(x);
      if(!v.ok) return v;
      var json = JSON.stringify(toWire(v.value));
      var bytes = new TextEncoder().encode(json);
      if(bytes.length > LIMITS.bytes) fail('too_big', 'payload over limit');
      var payload = CODEC + b64e(await deflate(bytes));
      if(payload.length > LIMITS.encoded) fail('too_big', 'encoded over limit');
      return { ok:true, value:payload, bytes:bytes.length };
    } catch(e){ return refusal(e); }
  }

  // payload string → validated logical object. `kind` ('list'|'report'),
  // when given, refuses the other kind.
  async function decode(payload, kind){
    try {
      if(typeof payload !== 'string' || payload.length === 0) fail('damaged', 'empty');
      if(payload.length > LIMITS.encoded) fail('too_big', 'encoded over limit');
      if(payload[0] !== CODEC){
        if(/^[2-9A-Za-z]/.test(payload)) fail('newer', 'codec ' + payload[0]);
        fail('damaged', 'codec');
      }
      if(!PAYLOAD_RE.test(payload)) fail('damaged', 'charset');
      var raw = await inflate(b64d(payload.slice(1)), LIMITS.bytes);
      var json;
      try { json = new TextDecoder('utf-8', { fatal:true }).decode(raw); } catch(e){ fail('damaged', 'utf-8'); }
      var a;
      try { a = JSON.parse(json); } catch(e){ fail('damaged', 'json'); }
      return { ok:true, value:fromWire(a, kind) };
    } catch(e){ return refusal(e); }
  }

  // ---- links and files ----------------------------------------------------------

  function linkFor(kind, payload){ return LINK[kind] + payload; }

  // Pull the payload out of a location.hash. Returns null unless the hash is
  // exactly '#crew=<payload>' (or '#report=…') in the payload alphabet — the
  // hash is untrusted input, and anything else is not ours to interpret.
  function fromHash(hash, kind){
    var key = kind === 'list' ? '#crew=' : kind === 'report' ? '#report=' : null;
    if(!key || typeof hash !== 'string' || hash.indexOf(key) !== 0) return null;
    var p = hash.slice(key.length);
    return (p.length <= LIMITS.encoded && PAYLOAD_RE.test(p)) ? p : null;
  }

  // The file fallback wraps the SAME payload, so a file goes through the one
  // decoder a link does — no second parser to keep honest.
  function fileFor(list, payload){
    var slug = function(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 30) || 'job'; };
    return { name:'notebuilt-crew-' + slug(list.job.name) + '-' + list.day + '.json',
             text:JSON.stringify({ f:FORMAT, k:'list', p:payload }) };
  }
  // Is this parsed JSON a crew file? Returns the payload string or null; the
  // caller then decode()s it like any link.
  function fromFile(obj){
    if(!obj || typeof obj !== 'object' || obj.f !== FORMAT || obj.k !== 'list') return null;
    return (typeof obj.p === 'string' && obj.p.length <= LIMITS.encoded && PAYLOAD_RE.test(obj.p)) ? obj.p : null;
  }

  // ---- size: measure before sending, split what doesn't fit (spec §5, rule 12) -------

  // The link one payload would go out as, and whether it fits a text message.
  // Both apps call this (or split, which is built on it) before the share
  // sheet opens — nothing is ever found to be too long on arrival.
  async function measure(x){
    var e = await encode(x);
    if(!e.ok) return e;
    var link = linkFor(x.k, e.value);
    return { ok:true, link:link, payload:e.value, chars:link.length, fits:link.length <= SAFE_LINK_CHARS };
  }
  async function sized(x){
    var m = await measure(x);
    if(!m.ok) fail(m.code, m.detail);
    return m;
  }
  function clip(s){ var c = Array.from(s); return c.length > 40 ? c.slice(0, 40).join('') + '…' : s; }

  // One item won't fit a link even on its own. Say which of three things it
  // is — the caller renders them differently, and a long name must never be
  // blamed on a task. item is { task } or { worker } (a worker with no tasks),
  // or null when there was nothing to send but the names.
  async function blame(whole, item){
    var t = item && item.task || null;
    if(whole.k === 'report'){
      if(!t) fail('cannot_fit', 'report envelope');
      fail('task_too_long', 'note', { taskId:t.id, field:'note',
        reason:'The note on one task is too long to send in a link. Shorten it, then send again.' });
    }
    // The smallest part this item could travel in: itself and its own worker.
    var one = clone(whole); one.tasks = t ? [t] : []; one.part = 1; one.parts = 1;
    if(item && one.mode === 'crew'){
      var wid = t ? t.worker : item.worker.id;
      one.workers = one.workers.filter(function(w){ return w.id === wid; });
    }
    var plain = clone(one); plain.boss.name = 'x'; plain.job.name = 'x';
    plain.workers.forEach(function(w){ w.name = 'x'; });
    if((await sized(plain)).fits){
      // It fits once every name is one letter, so the names are the cause.
      // Name the one that costs the most.
      var who = [{ which:'boss', of:function(o){ return o.boss; } }, { which:'job', of:function(o){ return o.job; } }];
      one.workers.forEach(function(w, i){ who.push({ which:'worker', of:function(o){ return o.workers[i]; } }); });
      var worst = null;
      for(var i = 0; i < who.length; i++){
        var o = clone(one); who[i].of(o).name = 'x';
        var c = (await sized(o)).chars;
        if(!worst || c < worst.chars) worst = { chars:c, which:who[i].which, id:who[i].of(one).id, name:who[i].of(one).name };
      }
      fail('names_too_long', worst.which, { which:worst.which, id:worst.id, name:worst.name,
        reason:'The names leave no room for tasks in a link. “' + clip(worst.name) + '” takes the most room. Shorten it, then send again.' });
    }
    if(t) fail('task_too_long', 'text', { taskId:t.id, field:'text',
      reason:'“' + clip(t.text) + '” is too long to send in a link. Shorten it, then send again.' });
    // Not a task and not the names: nothing a split or an edit can rescue. With
    // today's limits no valid payload gets here; it is the guard, not a path.
    fail('cannot_fit', 'envelope');
  }

  // A whole payload (from sliceFor, crewPayloadFor or buildReport) → the links
  // to send, in order:
  //   { ok:true, sendId, parts:[{ part, parts, value, payload, link, chars }] }
  // One part when it fits. Otherwise the fewest parts — tasks kept in order,
  // each part filled until the next task would overflow — that each fit
  // SAFE_LINK_CHARS. Every part carries the payload's sendId and timestamp.
  // A multi-worker list splits like any other: a part carries only the
  // workers its tasks belong to, and workers with no tasks ride along after
  // the last task, so the whole roster still arrives.
  // Refusals the caller must tell apart (rule 12); nothing is returned to send:
  //   task_too_long  { taskId, field:'text'|'note' }            that task can't fit a link at all
  //   names_too_long { which:'boss'|'job'|'worker', id, name }  the names leave no room
  //   cannot_fit                                                 nothing a split or an edit can rescue
  async function split(x){
    try {
      var v = validate(x);
      if(!v.ok) return v;
      var whole = v.value, crew = whole.k === 'list' && whole.mode === 'crew';
      // What gets dealt out across parts: every task, then (crew lists only)
      // every worker who has none.
      var items = whole.tasks.map(function(t){ return { task:t }; });
      if(crew){
        var busy = {};
        whole.tasks.forEach(function(t){ busy[t.worker] = 1; });
        whole.workers.forEach(function(w){ if(!has(busy, w.id)) items.push({ worker:w }); });
      }
      var partOf = function(from, to, part, parts){
        var o = clone(whole), mine = items.slice(from, to), keep = {};
        o.tasks = mine.filter(function(it){ return it.task; }).map(function(it){ return it.task; });
        if(crew){
          mine.forEach(function(it){ keep[it.task ? it.task.worker : it.worker.id] = 1; });
          o.workers = o.workers.filter(function(w){ return has(keep, w.id); });
        }
        o.part = part; o.parts = parts; return o;
      };
      var entry = function(value, m){ return { part:value.part, parts:value.parts, value:value, payload:m.payload, link:m.link, chars:m.chars }; };
      var done = function(list){ return { ok:true, sendId:whole.sendId, parts:list }; };

      var all = partOf(0, items.length, 1, 1), m1 = await sized(all);
      if(m1.fits) return done([entry(all, m1)]);
      if(items.length < 2) await blame(whole, items[0] || null);

      // The part count rides in every part, so pack against a guess and raise
      // it until it is right: the links measured are then exactly the links
      // returned. Holding one item back for each part still to come makes a
      // guess that is high enough come out at exactly that many parts.
      for(var guess = 2; ; ){
        var out = [];
        for(var i = 0; i < items.length; ){
          var part = out.length + 1, best = null, took = 0;
          var stop = part < guess ? items.length - (guess - part) : items.length;
          for(var j = i + 1; j <= stop; j++){
            var cand = partOf(i, j, part, Math.max(guess, part)), m = await sized(cand);
            if(!m.fits) break;
            best = entry(cand, m); took = j - i;
          }
          if(!best) await blame(whole, items[i]);
          out.push(best); i += took;
        }
        if(out.length === guess) return done(out);
        guess = out.length;
      }
    } catch(e){ return refusal(e); }
  }

  // ---- parts: which send a device is following (spec §4, rule 11) ---------------------

  // cur: the `send` record held ({ id, parts, have:[n…] }) or null, and the
  // time of the newest payload merged so far. inc: an arriving payload.
  // The newest send is the one followed; a tie on time goes to the higher id,
  // so the answer never depends on arrival order. A part of an older send
  // still merges its tasks but never counts towards "complete".
  function follow(cur, curAt, inc, incAt){
    if(cur && cur.id === inc.sendId){
      need(cur.parts === inc.parts, 'part count changed within one send');
      var have = cur.have.indexOf(inc.part) < 0
        ? cur.have.concat([inc.part]).sort(function(a, b){ return a - b; }) : cur.have.slice();
      return { id:cur.id, parts:cur.parts, have:have };
    }
